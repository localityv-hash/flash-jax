  summary: "第一篇专门梳理 LLM 在线蒸馏的综述：按反馈信号、教师访问方式和损失作用范围组织散度最小化、奖励引导与自博弈三类方法，并讨论工业流水线中静态模仿的结构性缺陷。"
  plain: "OPD 论文一年冒出几百篇，这是一张按“信号从哪来、老师能看到什么”分好类的地图。"
