  summary: '在线镜像下降变体：采样均值作基线、以系数 $\tau$ 的相对熵正则锚定上一轮策略，不用价值网络与 PRM；配合长度惩罚、课程与优先采样、partial rollout 和 long2short，把长上下文 RL 做成系统。'
  plain: "每轮以当前模型为参照、只允许小步改进；答案太长要扣分，难题多练，长答案分段生成，最后再把长思考压缩成短回答。"
  takeaways:
    - "答案可被猜中的题（选择、判断、证明）会制造假阳性：k1.5 直接剔除，并删掉不写推理、8 次内就能猜中答案的题。"
    - "长度惩罚要预热：先不罚长度让能力长起来，再加长度奖励压缩冗余。"
