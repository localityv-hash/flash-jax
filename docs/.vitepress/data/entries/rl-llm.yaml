  evidence_note: "MiniMax 开源 456B（激活 45.9B）混合注意力推理模型；CISPO 与 GRPO、DAPO 做了受控对比。MiniMax 后续 M2 系列继续使用 CISPO，ScaleRL 配方也采用了这种损失。"
  summary: "提出 CISPO：不裁剪 token 更新，而是裁剪并截断梯度的重要性权重，让低概率的反思类 token 在多轮离策略更新中仍有梯度；Qwen2.5-32B 上只用一半步数追平 DAPO。"
  plain: "PPO 会把“变化太大”的 token 整个踢出训练，偏偏“等等、再检查一下”这类关键词最容易被踢；CISPO 只给它们的权重设上限，不踢人。"
  takeaways:
    - "一批数据要做多轮离策略更新时，裁剪 IS 权重（CISPO）比裁剪 token 更新更能保住稀有 token 的梯度。"
    - "RL 前先对齐训练与推理的数值精度：M1 把 LM head 提到 FP32 后，训练和推理的 token 概率才重新对齐。"
    - "用生成式 RM 时要在线监控“只变长不变好”的迹象，一旦出现就重新校准 RM。"
