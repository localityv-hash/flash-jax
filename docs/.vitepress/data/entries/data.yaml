# 数据横切视角（/lenses/data）的条目：RL/SFT 数据集、验证与去污染工具、数据选择方法。
# 各阶段的数据细节分别归属 /topics/sft、/topics/mid-training、/topics/multi-env；这里只收“数据工作流”本身的关键资源。
# summary / plain / takeaways / evidence_note 支持 `$公式$`（KaTeX）与 `代码`，构建时渲染；双引号字符串里的反斜杠要写成 \\。

# ---------- 验证与工具 ----------

- id: math-verify
  title: "Math-Verify"
  short: Math-Verify
  kind: project
  org: Hugging Face
  date: 2025-01
  repo: huggingface/Math-Verify
  links:
    - { label: "博客：用 Math-Verify 修正 Open LLM Leaderboard", url: "https://huggingface.co/blog/math_verify_leaderboard" }
  areas: [rl-llm]
  facets: [eval, data]
  tier: rec
  evidence: [industrial, adopted, open-source]
  evidence_note: "Hugging Face 用它替换 Open LLM Leaderboard 的数学判分器，重评了全部 3,751 个模型，平均每个模型多判对约 61 题；小米 MiMo-7B 直接用它做数学 RL 的规则奖励，NVIDIA NeMo Gym 的数学环境、阶跃星辰 Open-Reasoner-Zero 的评测、verl 的内置 reward 与 Open-R1 的 accuracy_reward 都调用它。"
  summary: "规则式数学判分库：格式无关地抽取答案，归一化 LaTeX、单位与百分号后转成 SymPy，再做字符串、符号与数值容差比较，覆盖集合、区间与矩阵；部分比较刻意不对称，防止模型钻空子。"
  plain: "像一位不挑写法的判卷老师：“0.5”和“1/2”写法不同也算同一个答案；但把题目里的不等式原样抄回来冒充答案，不给分。"
  takeaways:
    - "做数学 RLVR 时要求模型把最终答案写进 `\\boxed{}`，并把抽取优先级设成 boxed 优先，可以明显减少“答对却判错”。"
    - "参考答案本身解析失败时跳过该样本（Open-R1 记为 None），不要给 0 分，否则是在惩罚数据错误而不是模型。"
    - "验证放进带超时的子进程（SymPy 化简可能卡死），奖励与评测用同一套配置，训练曲线和榜单分数才可比。"
  tags: [答案归一化, 规则奖励, 数学评测]

- id: sandbox-fusion
  title: "SandboxFusion"
  short: SandboxFusion
  kind: project
  org: ByteDance Seed
  date: 2024-10
  repo: bytedance/SandboxFusion
  url: https://bytedance.github.io/SandboxFusion/
  links:
    - { label: "论文：FullStack Bench（arXiv 2412.00535）", url: "https://arxiv.org/abs/2412.00535" }
  areas: [rl-llm, agentic-rl]
  facets: [env, data]
  tier: ref
  evidence: [open-source]
  evidence_note: "ByteDance Seed 代码团队开源、随 FullStack Bench 论文发布的判题沙箱；verl 内置了调用它的代码奖励后端和多轮工具示例。暂未见其他团队在技术报告里点名采用，因此列为参考。"
  summary: "LLM 代码的隔离执行与判题服务：支持二十多种语言和 Jupyter 模式，内置 HumanEval、MBPP、CodeContests 等数据集的判题逻辑，可直接充当代码 RLVR 的奖励后端。"
  plain: "给模型写的代码准备一个隔离的考场：代码在里面跑、按测试给分，就算写出死循环或危险操作也不影响外面。"
  takeaways:
    - "代码 RL 的吞吐常卡在判题而不是生成：把沙箱做成独立服务并发跑测试，每次执行都设超时与资源上限。"
    - "stdin/stdout 判题要统一行尾与空白的比较规则，否则会出现成批的“答案对、判错”。"
  tags: [代码沙箱, 判题, 代码 RL]

- id: llm-decontaminator
  title: "Rethinking Benchmark and Contamination for Language Models with Rephrased Samples"
  short: LLM Decontaminator
  kind: paper
  org: LMSYS · UC Berkeley
  authors: "Shuo Yang et al."
  date: 2023-11
  arxiv: "2311.04850"
  repo: lm-sys/llm-decontaminator
  links:
    - { label: 博客, url: "https://lmsys.org/blog/2023-11-14-llm-decontaminator/" }
  areas: [sft, mid-training]
  facets: [data, eval]
  tier: rec
  evidence: [open-source, ablation, community]
  evidence_note: "LMSYS 出品、工具开源；用“在改写后的测试题上训练”的对照实验直接量化了 n-gram 去污染的漏检，并在 RedPajama、StarCoder、多个指令数据集以及 GPT 合成数据上报告了重合率，是数据污染方向被广泛引用的工作。"
  summary: "证明 n-gram 匹配挡不住改写或翻译过的测试题（13B 模型借此可在多个基准上逼近 GPT-4），提出“嵌入检索 + LLM 判定”的去污染器，并在 RedPajama、StarCoder 中查出 8–18% 的 HumanEval 重合。"
  plain: "考题换个说法、换种语言，逐字比对就查不出来了；它先找出“长得像”的训练样本，再请大模型判断是不是同一道题。"
  takeaways:
    - "n-gram 去污染只是第一道筛：对要对外报告的基准，再加一层嵌入检索 + LLM 复核，专抓改写题。"
    - "教师模型合成的数据同样可能带出基准题，蒸馏数据入库前也要走一遍去污染。"
  tags: [去污染, 改写检测, 评测可信度]

