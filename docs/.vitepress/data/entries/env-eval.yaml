# ───────────────────────── 评测基准：工具、网页、电脑操作、深度研究 ─────────────────────────

- id: tau-bench
  title: "τ-bench: A Benchmark for Tool-Agent-User Interaction in Real-World Domains"
  short: τ-bench
  kind: benchmark
  org: Sierra
  authors: "Shunyu Yao et al."
  date: 2024-06
  arxiv: "2406.12045"
  repo: sierra-research/tau-bench
  areas: [agentic-rl]
  facets: [eval, env]
  tier: must
  evidence: [adopted, open-source, community]
  evidence_note: "Kimi K2、AgentScaler、Seed2.0 等以 τ-bench / τ²-bench 作为核心工具使用基准，头部实验室的模型发布也普遍报告；它提出的 pass^k 成为衡量智能体稳定性的通用指标。原仓库已提示任务版本过时，推荐改用 τ³-bench。"
  summary: "模拟零售、航空客服：LLM 扮演的用户与被测智能体多轮对话，智能体须遵守领域政策并调用 API 改写数据库；以对话结束时数据库状态是否与目标一致判分，并提出衡量稳定性的 pass^k。"
  plain: "让一个 AI 扮顾客、一个 AI 当客服，客服得按公司规定查订单、退换货。最后只看数据库改得对不对；同一道题连做几次都对，才算真靠谱。"
  takeaways:
    - "面向生产的智能体至少报告 pass^k（k≥4）：pass^1 看着不错的模型，连续做对 4 次的概率可能掉一半。"
    - "用数据库终态而不是对话文本判分，能避开“话说得漂亮但事没办对”的误判。"
  tags: [工具使用, 用户模拟, pass^k]

- id: tau2-bench
  title: "τ²-Bench: Evaluating Conversational Agents in a Dual-Control Environment"
  short: τ²-bench
  kind: benchmark
  org: Sierra
  authors: "Victor Barres et al."
  date: 2025-06
  arxiv: "2506.07982"
  repo: sierra-research/tau2-bench
  url: https://taubench.com
  links:
