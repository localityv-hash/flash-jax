    - "对正确轨迹第 i 步的奖励乘以 γ^(T−i)，无需过程奖励就能鼓励更短的探索路径。"
    - "长尾轨迹用轮次级 partial rollout：超时任务存入回放缓冲，下一轮用新权重接着跑。"
