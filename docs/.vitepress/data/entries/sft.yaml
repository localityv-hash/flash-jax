# ---------- SFT 与 RL：目标函数、泛化与遗忘 ----------

- id: sft-memorizes-rl-generalizes
  title: "SFT Memorizes, RL Generalizes: A Comparative Study of Foundation Model Post-training"
  short: SFT 记忆·RL 泛化
  kind: paper
  org: HKU · UC Berkeley · Google DeepMind · NYU 等
  authors: "Tianzhe Chu et al."
  date: 2025-01
  venue: ICML 2025
  arxiv: "2501.17161"
  repo: LeslieTrue/SFTvsRL
  areas: [sft, rl-llm]
  facets: [theory]
  tier: rec
  evidence: [ablation, open-source, community]
  evidence_note: "引发“SFT 与 RL 各自学到什么”的广泛讨论；环境、训练与评测脚本、SFT 数据与检查点开源。实验限于纸牌算术（GeneralPoints）与导航（V-IRL）两类可控任务，外推到开放域需谨慎。"
  summary: "在规则可变的纸牌算术 GeneralPoints 与视觉导航 V-IRL 上对比：以结果奖励训练的 RL 能泛化到未见过的规则与视觉变体，SFT 则倾向记住训练规则、分布外性能下降；但 SFT 仍是 RL 的必要前置，用来稳定输出格式。"
  plain: "SFT 像背标准答案，规则一变就露馅；RL 像自己刷题对答案，学到的是解法。不过得先靠 SFT 教会答题格式，RL 才练得起来。"
  takeaways:
    - "评估 SFT 效果时一定加规则或分布变体的 OOD 测试，训练分布内的分数会高估真实能力。"
    - "RL 前的 SFT 以“格式稳定、能拿到奖励”为目标，不必训到训练集饱和。"
  tags: [泛化, SFT vs RL, 可控实验]

- id: math-reasoning-transfer
  title: "Does Math Reasoning Improve General LLM Capabilities? Understanding Transferability of LLM Reasoning"
  short: 数学推理可迁移性
  kind: paper
  org: CMU · 华盛顿大学 等
  authors: "Maggie Huan et al."
  date: 2025-07
  arxiv: "2507.00432"
  repo: ReasoningTransfer/Transferability-of-LLM-Reasoning
  areas: [sft, rl-llm]
  facets: [theory, eval]
  tier: rec
  evidence: [ablation, open-source]
  evidence_note: "评测 20 多个开源推理模型，并在同一底座、同一批数学数据上对照 SFT 与 RL；代码与模型开源。结论与“在线学习遗忘更少”的一系列工作相互印证。"
  summary: "提出迁移性指标，发现数学提升能否迁移取决于训练方式而非模型大小：RL 调优的模型在其他推理与非推理任务上保持甚至提升，SFT 调优的模型在非推理任务上明显退化；表示与 token 分布分析显示 SFT 大范围扰动了与任务无关的 token。"
  plain: "同样用数学题训练，RL 练出来的模型别的本事没丢，SFT 练出来的却偏科：数学涨了，聊天、指令遵循反而退步。"
  takeaways:
    - "用领域数据做 SFT 后，必测一组非目标任务（对话、指令遵循、事实性）来监控遗忘。"
    - "已有可验证奖励时，领域能力的提升尽量交给 RL，SFT 只负责格式与冷启动。"
  builds_on: [sft-memorizes-rl-generalizes]
  tags: [遗忘, 迁移, SFT vs RL]

- id: dft
  title: "On the Generalization of SFT: A Reinforcement Learning Perspective with Reward Rectification"
  short: DFT
  kind: paper
  org: 东南大学 · UC Merced 等
  authors: "Yongliang Wu et al."
  date: 2025-08
  venue: ICLR 2026
  arxiv: "2508.05629"
  repo: yongliang-wu/DFT
  areas: [sft]
  facets: [algorithm, theory]
  tier: rec
  evidence: [adopted, ablation, open-source, community]
  evidence_note: "TRL（loss_type 设为 dft）、LLaMA-Factory、ms-swift 已内置该损失；实验集中在 7B 及以下的数学、代码与多模态推理。作者在仓库中说明：在答案唯一、推理近乎确定（低熵）的任务上效果较弱，社区也反馈过文学、金融等场景的失败案例。"
  summary: "证明 SFT 梯度等价于一种策略梯度，其隐式奖励是“是否等于示范”再乘以 1/π_θ：模型越没把握的样本权重越大，方差大、泛化差。DFT 把每个 token 的损失乘以自身概率（停止梯度），一行代码即在多个数学基准上显著优于 SFT。"
  plain: "普通 SFT 对模型最没把握的字用力最猛，容易死记硬背；DFT 按模型自己的把握程度给每个字的损失打折，更像 RL 那样顺着自己的分布学。"
  takeaways:
    - "示范存在多种合理解法（数学 CoT、复杂代码）时，可以把 DFT 当作 SFT 的低成本替换做 A/B。"
    - "答案高度确定（低熵）的任务保留标准 NLL：作者自己报告 DFT 在这类任务上偏弱。"
  builds_on: [sft-memorizes-rl-generalizes]
  tags: [SFT 目标函数, 奖励修正, SFT vs RL]

# ---------- 参数高效微调 ----------

- id: lora-without-regret
  title: "LoRA Without Regret"
  short: LoRA Without Regret
  kind: blog
  org: Thinking Machines Lab
  authors: "John Schulman et al."
  date: "2025-09-29"
  url: https://thinkingmachines.ai/blog/lora/
  links:
    - { label: TRL 复现指南, url: "https://huggingface.co/docs/trl/en/lora_without_regret" }
  areas: [sft, rl-llm]
  facets: [algorithm, infra]
  tier: must
  evidence: [industrial, adopted, ablation, community]
  evidence_note: "出自 Thinking Machines，其 Tinker 训练服务以 LoRA 为训练接口，cookbook 里 LoRA 学习率直接取全参的 10 倍；Hugging Face TRL 发布官方复现指南并复现了 RL 曲线。在 Llama 3 与 Qwen3（含 MoE）上系统扫了 rank、学习率与批大小，发布后被广泛转引讨论。"
  summary: "系统比较 LoRA 与全参：中小规模后训练数据上高 rank LoRA 与全参曲线几乎重合，数据超出容量才落后；应挂满所有层（尤其 MLP/MoE）；对大批量更敏感；RL 用 rank 1 即可匹配全参；最优学习率约为全参 10 倍。"
  plain: "设置对了，LoRA 在多数后训练场景不比全参差：挂满所有层、学习率调大约十倍、批次别太大；做 RL 时连 rank 1 都够用。"
  takeaways:
    - "LoRA 挂到所有线性层（all-linear），不要只挂注意力；学习率从全参最优值的约 10 倍起扫。"
    - "RL 用低 rank（1–32）即可；SFT 数据规模越大越需要高 rank，超出容量时改用全参。"
    - "LoRA 下别盲目加大批次：大批次带来的损失惩罚无法靠提高 rank 弥补。"
  tags: [LoRA, 参数高效微调, 超参]
