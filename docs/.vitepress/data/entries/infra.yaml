  tier: rec
  evidence: [industrial, adopted, open-source, community]
  evidence_note: "官方 README 列为 GLM-4.5、4.6、4.7 与 GLM-5 系列的 RL 框架；RadixArk 的 Miles、vLLM 项目的 vime、RedAI Infra 的 Relax、阿里 Accio 的 Dressage 等都构建在 slime 之上；与 SGLang 团队合作实现了确定性推理下的可复现 RL。"
  summary: "Megatron 训练 + SGLang 推理的原生组合，两端参数直通；一个开关在共置与分离之间切换，rollout 以 server 模式经 router 暴露，自定义生成函数即可接入多轮工具调用、沙箱与全异步 rollout。"
  plain: "只做一件事并做到极致：训练用 Megatron、生成用 SGLang，中间用数据缓冲区连起来；想训 agent，就把“怎么生成数据”这一步换成你自己的函数。"
  takeaways:
    - "大 MoE、需要 Megatron 全套并行（TP/PP/EP/CP）时优先考虑；调性能先用 --debug-rollout-only 与 --debug-train-only 分别压测两端。"
    - "agent 场景让环境直接调用 router 暴露的 OpenAI 兼容接口，不要把环境逻辑塞进训练循环。"
  builds_on: [sglang]
  tags: [Megatron, SGLang, GLM, agentic RL]

- id: areal
  title: "AReaL: A Large-Scale Asynchronous Reinforcement Learning System for Language Reasoning"
  short: AReaL
  kind: paper
  org: 蚂蚁集团 AReaL 团队 · 清华大学交叉信息研究院
  authors: "Wei Fu et al."
  date: 2025-05
  venue: NeurIPS 2025
  arxiv: "2505.24298"
  repo: areal-project/AReaL
  links:
    - { label: v0.3 技术博客, url: https://github.com/areal-project/AReaL/blob/main/blog/AReaL_v0_3.md }
    - { label: AReaL 2.0 技术报告, url: https://arxiv.org/abs/2607.01120 }
  areas: [rl-llm, agentic-rl]
  facets: [infra, algorithm]
  tier: must
  evidence: [industrial, adopted, ablation, open-source, community]
  evidence_note: "蚂蚁用它训练 ASearcher 搜索智能体与 AReaL-SEA 等模型；verl 的 one-step-off 实现以 AReaL 为参考，其全异步训练器在“部分 rollout + 训练端重算 logprob”配置下即近似 AReaL 的 decoupled PPO；CAMEL-AI 的终端智能体 SETA 用 AReaL 训练。论文给出吞吐、陈旧度与目标函数的消融。"
  summary: "把生成与训练彻底解耦到两组 GPU：rollout 可被权重更新打断，丢弃旧 KV cache 后用新权重续写；用陈旧度上限 η 控制样本版本差，并以 decoupled PPO 区分行为策略与近端策略，相对同步系统吞吐最高约 2.57 倍。"
  plain: "出题的人一直出、改卷的人攒够一批就改；卷子不能太旧（最多落后 η 个版本），改的时候还要按“当时是谁出的题”做修正。"
  takeaways:
    - "从 η=1（相当于一步重叠）开始调，逐步放大，每次都对照同步基线的收敛曲线。"
    - "异步时一定分开行为策略与近端策略：裁剪锚定在训练端重算的近端策略上，行为策略与它的差异用重要性权重修正。"
  builds_on: [async-rlhf]
  tags: [异步 RL, 陈旧度, decoupled PPO]

