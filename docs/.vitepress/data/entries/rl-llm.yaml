  takeaways:
    - "答案可被猜中或根本没有最终答案（证明、开放问题）时，用“验证器 + 元验证”代替答案匹配，并持续用更大的验证算力给新难例打标签，保持生成与验证之间的差距。"
  builds_on: [grpo]
