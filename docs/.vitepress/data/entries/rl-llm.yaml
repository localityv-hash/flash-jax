  evidence: [industrial, adopted, ablation, community]
  evidence_note: "Anthropic 用宪法方法训练 Claude；Google Research 的 RLAIF 研究（Lee et al., 2023）沿用 AI 反馈思路，与人类反馈做了系统对照；Hugging Face 发布了用开源模型复现的配方。仓库为论文补充材料。"
  summary: "只用一份自然语言“宪法”代替人工有害性标注：SL 阶段让模型按原则自我批评并改写，RL 阶段用 AI 给出的偏好训练偏好模型再做 RL（RLAIF），得到无害且不回避的助手。"
  plain: "不再请人逐条判断哪句话有害，而是给模型一本“守则”，让它自己挑刺、自己改，再用它的判断去训练打分员。"
  takeaways:
    - "偏好标注昂贵或需要统一口径时，先把标准写成可执行的原则，再让强模型按原则比较回答，人工只做抽检。"
    - "AI 反馈同样会被钻空子：原则越含糊，策略越容易学出讨好或说教式回答，需要定期人工审计。"
  builds_on: [instructgpt]
  tags: [RLAIF, 宪法, 无害性]

- id: dpo
  title: "Direct Preference Optimization: Your Language Model is Secretly a Reward Model"
  short: DPO
  kind: paper
  org: Stanford
  authors: "Rafael Rafailov et al."
  date: 2023-05
  venue: NeurIPS 2023
  arxiv: "2305.18290"
  repo: eric-mitchell/direct-preference-optimization
  areas: [rl-llm]
  facets: [algorithm]
  tier: must
  evidence: [adopted, open-source, ablation, community]
  evidence_note: "Llama 3、Tülu 3 等工业与开源后训练把 DPO 或其变体作为偏好优化阶段；官方代码开源，TRL、OpenRLHF 等框架均有实现。"
  summary: "证明 KL 约束下 RLHF 的最优策略有闭式解，于是奖励可写成策略与参考策略的对数比，直接在偏好对上用一条二分类损失训练，免去奖励模型和在线采样。"
  plain: "不单独训练打分员，也不在线生成：拿“好回答 / 差回答”成对数据，直接把好回答的相对概率抬高、差回答压低。"
  takeaways:
    - "有高质量成对偏好、只想低成本对齐风格与安全时，DPO 是首选基线；要探索新解法（数学、代码）时，它替代不了在线 RL。"
    - "偏好数据与当前策略的分布差得越远，效果越打折；可以用当前模型重新采样构造偏好对，做迭代或在线 DPO。"
  builds_on: [instructgpt]
  tags: [偏好优化, 离线, Bradley–Terry]

