- id: kimi-k2-5
  title: "Kimi K2.5: Visual Agentic Intelligence"
  short: Kimi K2.5
  kind: report
  org: 月之暗面 Moonshot AI
  date: 2026-01
  url: https://www.kimi.com/blog/kimi-k2-5.html
  repo: MoonshotAI/Kimi-K2.5
  links:
    - { label: 技术报告 PDF, url: "https://github.com/MoonshotAI/Kimi-K2.5/blob/main/tech_report.pdf" }
  areas: [agentic-rl]
  facets: [algorithm, infra]
  tier: rec
  evidence: [industrial, open-source, ablation]
  evidence_note: "开源权重的多模态智能体旗舰；技术报告公开了并行智能体 RL（PARL）的奖励设计与关键步数约束，以及可同时编排 10 万个智能体任务的统一 RL 环境与训推不一致修正。"
  summary: "在 K2 上做视觉—文本联合训练并提出 Agent Swarm：可训练编排器动态创建冻结子智能体并行执行。PARL 奖励 = 实例化奖励 + 完成率 + 结果奖励（辅助项退火到 0），用关键步数约束延迟。"
  plain: "一个“包工头”模型学会把大任务拆开，派给一群临时工人同时干；只训练包工头，工人的产出当作环境反馈。"
  takeaways:
    - "多智能体 RL 的信用分配可以用“只训编排器、冻结执行者”绕开：执行者输出当作环境观察。"
    - "为防串行坍缩与虚假并行，先用两个辅助奖励引导探索，再把系数退火到 0，让目标回到任务结果本身。"
    - "长程多步工具调用 RL 要按对数比率区间做 token 级梯度屏蔽来约束训推不一致，报告称这对稳定性至关重要。"
  builds_on: [kimi-k2]
  tags: [多智能体, PARL, 训推一致]

