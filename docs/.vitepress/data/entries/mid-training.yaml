# Mid-training 专题（/topics/mid-training）的条目。
# 覆盖：学习率调度与退火、中训练数据（质量筛选 / 改写 / 数学与代码语料）、长上下文扩展、面向 RL 与智能体的中训练。
# 关键数字均可在对应论文、官方仓库配置或模型卡中核对；指标（引用 / star）由 CI 抓取，不手填。

# ───────────── 学习率调度与退火 ─────────────

- id: minicpm
  title: "MiniCPM: Unveiling the Potential of Small Language Models with Scalable Training Strategies"
  short: MiniCPM（WSD）
  kind: paper
  org: 清华大学 · 面壁智能（OpenBMB）
  authors: "Shengding Hu et al."
  date: "2024-04"
  venue: COLM 2024
  arxiv: "2404.06395"
  repo: OpenBMB/MiniCPM
  areas: [mid-training]
  facets: [algorithm, data]
  tier: must
  evidence: [industrial, adopted, ablation, open-source]
  evidence_note: "面壁智能 MiniCPM 系列的正式训练方案，MiniCPM4 继续沿用 WSD（7T 稳定 + 1.3T 退火）。Kimi K2 技术报告把它列为所用 WSD 调度的出处，GLM-4.5 报告也以它为对照（并说明自己为何改用余弦）；SmolLM3 同样采用 WSD、在最后 10% 步数衰减。论文含 0.036B–2.4B 的调度与“衰减期加入 SFT 数据”对照实验。"
  summary: "提出 Warmup-Stable-Decay 调度：大部分时间保持恒定学习率，最后约 10% token 快速衰减，损失随之骤降；并主张把高质量数据与 SFT 数据混进衰减期，实验显示比只在 SFT 阶段加入效果更好。"
  plain: "先用大步子跑很久，最后一小段放慢脚步“收尾”，成绩会明显变好；收尾这段吃什么数据，模型就往哪边靠。"
  takeaways:
    - "总训练量还没定时用 WSD：从任一稳定期检查点起做约 10% 的衰减，就能得到一个可用的模型。"
    - "想强化某项能力，从衰减期就开始混入高质量 / 指令数据，而不是全押在 SFT 上。"
  tags: [WSD, 退火, 学习率调度]

- id: cooldown-scaling
  title: "Scaling Laws and Compute-Optimal Training Beyond Fixed Training Durations"
  short: 冷却与缩放律
  kind: paper
  org: EPFL · Hugging Face
  authors: "Alexander Hägele et al."
  date: "2024-05"
  venue: NeurIPS 2024 Spotlight
  arxiv: "2405.18392"
  repo: epfml/schedules-and-scaling
  areas: [mid-training]
  facets: [algorithm, theory]
  tier: ref
  evidence: [ablation, open-source]
  evidence_note: "NeurIPS 2024 Spotlight，代码开源（含 WSD 调度与权重平均实现）。它把“恒定学习率 + 末段冷却”当作余弦的直接替代做了系统对比，是后来大量用 WSD 做缩放律实验的依据之一；实验规模以中小模型为主。"
  summary: "论证余弦调度把训练长度写死，不同长度无法复用同一条曲线；“恒定学习率 + 末段冷却”的效果可预测地与余弦相当，随机权重平均还能沿轨迹免费提升，因此缩放律实验可以只跑少数长程、从中途检查点分别冷却。"
  plain: "不必为每个训练长度从头跑一遍：跑一条长的，在想要的位置“刹车冷却”，就能拿到对应长度的结果。"
  takeaways:
    - "做数据或缩放律实验时，用“一条恒定学习率长跑 + 多个中途冷却分支”代替多次从头训练。"
  builds_on: [minicpm]
  tags: [WSD, 冷却, 缩放律, 权重平均]

- id: llama3
  title: "The Llama 3 Herd of Models"
  short: Llama 3
  kind: report
  org: Meta
  authors: "Llama Team, AI @ Meta"
  date: "2024-07"
  arxiv: "2407.21783"
  repo: meta-llama/llama-models
  areas: [mid-training]
  facets: [data, eval]
  tier: must
  evidence: [industrial, adopted, ablation, open-source, community]
  evidence_note: "Meta Llama 3/3.1 的完整技术报告，开源权重是大量下游模型的底座。“用退火评估数据价值”被 MiniCPM4 明确借鉴（同样取新数据 30%、默认配比 70%），ProLong 等工作直接在 Llama-3 上继续训练长上下文。"
  summary: "405B 预训练分初始、长上下文（六段 8K→128K，约 800B token）与退火三段；退火期上采样最高质量数据、学习率降到 0 并平均检查点；还用“半程 8B + 40B token 退火”低成本评估新数据。"
  plain: "Llama 3 把预训练最后一小段当成“精修”：换上最好的数据、学习率降到 0、再把几个检查点平均；还把这段精修当成快速“试吃”新数据的工具。"
  takeaways:
    - "评估新数据源不必从头训：拿中途检查点做一次短退火（新数据约占 30%），与只用默认配比的退火对比。"
    - "长上下文扩展的验收标准要双管齐下：短文本评测完全恢复，目标长度的大海捞针全对。"
    - "退火数据里不要放常用评测的训练集，否则分数会高估真实的少样本与泛化能力。"
  tags: [退火, 长上下文, 数据评估, 检查点平均]

- id: olmo2
  title: "2 OLMo 2 Furious"
  short: OLMo 2
  kind: report
  org: Allen Institute for AI (AI2)
  authors: "Team OLMo"
  date: "2024-11"
  arxiv: "2501.00656"
  repo: allenai/OLMo
  links:
    - { label: Dolmino Mix 1124 数据, url: "https://huggingface.co/datasets/allenai/dolmino-mix-1124" }
  areas: [mid-training]
  facets: [data, algorithm]
  tier: must
  evidence: [industrial, adopted, ablation, open-source]
  evidence_note: "AI2 全开源模型：权重、数据、代码、日志与中间检查点全部公开，OLMo 仓库里能直接看到 stage 2 每个随机种子的配置与 microanneal 配置。Dolmino Mix 1124 被后续研究直接当作中训练语料（如 Meta 等的 KD 中训练实验），SmolLM3 沿用了它“嵌入层不做权重衰减”的稳定性设置。"
  summary: "通用预训练后，用 Dolmino Mix 1124（DCLM 高分网页、FLAN、学术文本与大量合成数学）做学习率线性降到 0 的中训练；7B 以三种数据顺序各训 50B 再平均成模型汤，13B 用 3×100B + 1×300B。"
  plain: "先把模型养大，再用一小锅精选食材（高质量网页 + 数学题）收汁；同一锅换三种下料顺序各做一遍，最后把三份平均成一份。"
  takeaways:
    - "中训练预算有限时，“同一配比、不同数据顺序多跑几次再平均”往往比只跑一次更稳。"
    - "新数据源上线前先做 microanneal：从稳定期检查点起短退火，比较加 / 不加该数据的差异。"
  builds_on: [dclm, llama3]
  tags: [Dolmino, 模型汤, microanneal, 全开源]

# ───────────── 中训练数据：筛选、改写、专门语料 ─────────────

- id: physics-of-lms
  title: "Physics of Language Models: Part 3.1, Knowledge Storage and Extraction"
  short: Physics of LMs 3.1
  kind: paper
  org: Meta FAIR · MBZUAI
  authors: "Zeyuan Allen-Zhu, Yuanzhi Li"
  date: "2023-09"
  venue: ICML 2024
  arxiv: "2309.14316"
  repo: facebookresearch/PhysicsLM4
  links:
    - { label: "Part 3.3 知识容量缩放律", url: "https://arxiv.org/abs/2404.05405" }
  areas: [mid-training]
  facets: [theory]
  tier: rec
  evidence: [ablation, community, open-source]
  evidence_note: "ICML 2024；在可控的合成传记数据上用（近）线性探针观察知识如何被存储，结论与 Kimi K2、Nemotron-CC 等“改写数据”的工业实践方向一致。系列的 bioS/bioR 数据生成器已随 facebookresearch/PhysicsLM4 开源。注意结论来自合成数据与中小模型。"
  summary: "用合成传记数据证明：知识只有在预训练时被充分增广（改写、句子重排）才能在之后被问答提取，否则模型背得下却提不出，准确率为 0%，指令微调也补不回；作者据此建议用小模型改写预训练数据，并尽早把指令数据混进预训练。"
  plain: "只以一种说法见过一次的知识，模型“背得出原文却答不出问题”；同一件事换多种说法见过，才算真学会。"
  takeaways:
    - "知识密集的高质量语料，宁可改写多遍（换风格、换视角），也不要原样重复多轮。"
    - "如果后续要靠问答使用这些知识，在中训练就混入 QA / 指令格式数据，别等到 SFT。"
  tags: [知识存储, 改写, 理论, 探针]

- id: fineweb
  title: "The FineWeb Datasets: Decanting the Web for the Finest Text Data at Scale"
  short: FineWeb / FineWeb-Edu
  kind: dataset
  org: Hugging Face
  authors: "Guilherme Penedo et al."
  date: "2024-06"
  venue: NeurIPS 2024 Datasets & Benchmarks
  arxiv: "2406.17557"
  repo: huggingface/datatrove
  links:
    - { label: FineWeb-Edu 数据集, url: "https://huggingface.co/datasets/HuggingFaceFW/fineweb-edu" }
    - { label: 教育质量分类器, url: "https://huggingface.co/HuggingFaceFW/fineweb-edu-classifier" }
  areas: [mid-training]
  facets: [data]
  tier: rec
  evidence: [industrial, adopted, open-source, community]
  evidence_note: "Hugging Face 的开放预训练语料：SmolLM3 以 FineWeb-Edu / FineWeb2 为网页主干，ProLong 的短数据混合里 FineWeb 与 FineWeb-Edu 各占 10%，NVIDIA Nemotron-CC 把它和 DCLM 作为主要对照。处理代码在 datatrove，分类器训练代码在 huggingface/smollm。"
  summary: "从 96 个 Common Crawl 快照构建 15T token 的 FineWeb；再用 Llama-3-70B-Instruct 标注的教育价值训练小分类器，筛出 1.3T token 的 FineWeb-Edu，在知识与推理基准上显著领先。"
  plain: "先请大模型当“阅卷老师”给一小批网页打分，再训练一个便宜的小模型按同样标准给海量网页打分，只留下有教育意义的。"
  takeaways:
    - "做质量筛选时，“强模型标注小样本 → 蒸馏成小分类器 → 全量打分”是性价比最高的流程。"
    - "教育价值筛选对知识 / 推理类基准最有效，但会大幅减少数据量；训练预算很长时要权衡保留量。"
  tags: [质量分类器, 预训练数据, 开放数据集]

- id: dclm
  title: "DataComp-LM: In search of the next generation of training sets for language models"
  short: DCLM
  kind: dataset
  org: UW · Apple · TRI 等
  authors: "Jeffrey Li et al."
  date: "2024-06"
  venue: NeurIPS 2024 Datasets & Benchmarks
  arxiv: "2406.11794"
  repo: mlfoundations/dclm
  areas: [mid-training]
  facets: [data, eval]
  tier: rec
  evidence: [adopted, ablation, open-source, community]
  evidence_note: "OLMo 2 的 Dolmino 中训练直接使用按 DCLM 分类器筛出的前 7% 网页（OLMo 仓库 stage 2 配置可查），SmolLM3 的网页主干也包含 DCLM。平台提供 240T token 原始池、53 项评测与 412M–7B 的标准化训练配方。"
  summary: "固定模型与配方、只比较数据的测试平台（240T token 池、53 项评测）。结论：模型过滤最关键，以 OH-2.5 与 ELI5 为正样本的 fastText 分类器筛出 DCLM-Baseline，7B 用 2.6T token 达约 64% MMLU。"
  plain: "与其凭感觉挑数据，不如固定模型和训练方式、只换数据来比较；结果发现“像高质量问答”的网页最值钱。"
  takeaways:
    - "质量分类器的正样本优先选指令 / 问答风格的高质量文本（如 OH-2.5、ELI5），往往比只用百科更能提升下游。"
    - "比较数据方案时固定模型规模与训练 token，只改数据，否则结论不可比。"
  tags: [质量分类器, fastText, 数据测试平台]

- id: nemotron-cc
  title: "Nemotron-CC: Transforming Common Crawl into a Refined Long-Horizon Pretraining Dataset"
  short: Nemotron-CC
  kind: dataset
  org: NVIDIA
  authors: "Dan Su et al."
  date: "2024-12"
  arxiv: "2412.02595"
  url: "https://data.commoncrawl.org/contrib/Nemotron/Nemotron-CC/index.html"
  areas: [mid-training]
  facets: [data]
  tier: rec
  evidence: [adopted, ablation, open-source]
  evidence_note: "数据集在 Common Crawl 上公开；AI2 在 Olmo 3 的官方中训练配比里放入约 5% 的 Nemotron-CC 高质量合成 QA（OLMo-core 配置可查）。论文在 1T 与 15T 两个 token 尺度上与 DCLM、Llama 3.1 做了对照。"
  summary: "针对 FineWeb-Edu、DCLM 丢弃约 90% 数据的问题，用分类器集成、合成改写与更少的启发式过滤得到 6.3T token（含 1.9T 合成）；1T 训练下高质量子集比 DCLM 高 5.6 MMLU。"
  plain: "不是把“差”网页一扔了之，而是请模型把它们重写一遍，再给“好”网页出几套练习题，数据量和质量兼得。"
  takeaways:
    - "训练预算很长（10T 以上）时，别只用激进过滤后的小语料；用改写把中低质量数据“救回来”。"
    - "对高质量文档生成多种形式的合成数据（问答、蒸馏、知识抽取），可直接充当中训练里的 QA 配料。"
  builds_on: [fineweb, dclm]
  tags: [改写, 合成数据, 分类器集成]

- id: phi-4
  title: "Phi-4 Technical Report"
  short: Phi-4
  kind: report
  org: Microsoft Research
  authors: "Marah Abdin et al."
  date: "2024-12"
  arxiv: "2412.08905"
  links:
    - { label: 模型权重, url: "https://huggingface.co/microsoft/phi-4" }
  areas: [mid-training]
  facets: [data]
  tier: rec
  evidence: [industrial, ablation]
  evidence_note: "微软 Phi 系列正式发布的 14B 模型；报告给出完整的预训练配比表（各类数据的独立 token 数与轮数）和合成数据对照实验，是“合成数据能反复用多少轮”最直接的公开证据之一。"
  summary: "约 10T token 预训练，合成数据占 40%（约 290B 独立 token、13.8 轮）；随后 250B token 中训练把上下文从 4K 扩到 16K：30% 新长文本 + 70% 回放，RoPE base 升到 250K。"
  plain: "Phi-4 的主食是“教科书式”的合成题，反复吃十几遍也不腻；但只吃合成题会缺常识，所以还得搭配真实网页。"
  takeaways:
    - "合成数据可以多轮复用（Phi-4 达 13.8 轮），但必须混入真实网页 / 书籍来保住知识类能力。"
    - "扩上下文优先用天然长文档，而不是把短样本拼接凑长；并保留大比例预训练回放防遗忘。"
  tags: [合成数据, 数据配比, 长上下文]

