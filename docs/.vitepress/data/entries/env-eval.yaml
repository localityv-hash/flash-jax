# ───────────────────────── 规模化合成：程序化推理环境 ─────────────────────────

- id: reasoning-gym
  title: "REASONING GYM: Reasoning Environments for Reinforcement Learning with Verifiable Rewards"
  short: Reasoning Gym
  kind: paper
  org: Open Thought 社区
  authors: "Zafir Stojanovski et al."
  date: 2025-05
  arxiv: "2505.24760"
  repo: open-thought/reasoning-gym
  areas: [rl-llm]
  facets: [env, data]
  tier: must
  evidence: [adopted, open-source, community]
  evidence_note: "仓库的 “Projects Using Reasoning Gym” 列出 NVIDIA 的 ProRL、BroRL 与 Nemotron 3 Super 技术报告、Prime Intellect 的 SYNTHETIC-2 数据集等工业工作；verifiers、GEM、NeMo Gym 都直接集成了它。社区共建，持续新增任务。"
  summary: "100 多个程序化任务生成器与验证器，覆盖代数、算术、几何、图论、逻辑和多种游戏；每类任务难度参数可调、题目可无限生成，可按权重组合成复合数据集，评分函数直接作为 RLVR 奖励。"
  plain: "不是一份固定题库，而是 100 多台“出题机”：要多少题出多少题，难度旋钮自己拧，每道题都能自动判对错。"
  takeaways:
    - "想做 RLVR 实验又担心数据污染时，用程序化生成器现场出题：训练题和评测题都是新生成的，不会出现在预训练语料里。"
    - "多任务训练用复合数据集的权重控制各任务占比，并随训练调高难度参数，避免简单任务的零方差组浪费算力。"
  tags: [程序化生成, RLVR, 可验证环境]

