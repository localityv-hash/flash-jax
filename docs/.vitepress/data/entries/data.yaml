# ---------- 数据选择与难度 ----------

- id: polaris
  title: "POLARIS: A Post-Training Recipe for Scaling Reinforcement Learning on Advanced Reasoning Models"
  short: POLARIS
  kind: blog
  org: 香港大学 · ByteDance Seed · 复旦大学
  authors: "Chenxin An et al."
  date: "2025-06-20"
  repo: ChenxinAn-fdu/POLARIS
  url: https://hkunlp.github.io/blog/2025/Polaris
  links:
    - { label: "Polaris-Dataset-53K", url: "https://huggingface.co/datasets/POLARIS-Project/Polaris-Dataset-53K" }
  areas: [rl-llm]
  facets: [data, algorithm]
  tier: rec
  evidence: [open-source, ablation]
  evidence_note: "代码、53K 数据、训练日志与 1.7B/4B/7B 权重公开；在 DeepScaleR-40K 上做了“全量 / 删全对题 / 只留难题”三种难度分布的对照，并有采样温度与多阶段训练的消融。作者来自港大与字节 Seed，属研究型配方，暂未见工业模型公开采用。"
  summary: "给强推理模型继续做 RL 的配方：用待训模型采样 8 次估难度、删全对题，每阶段结束再剔除准确率高于 0.9 的题，并逐阶段升高采样温度；Qwen3-4B 的 AIME25 从 65.6 升到 79.4。"
  plain: "题目难度跟着学生水平走：学生变强后就把已经稳会的题拿掉，让题库始终“偏难一点”。"
  takeaways:
    - "拿到新基座先画难度直方图（每题采样 8 次的正确数）；若大量题 8/8 全对，先删掉再训。"
    - "不要只留最难的题：在 POLARIS 的对照里，只保留通过率不超过一半的题，效果反而不如只删全对题。"
    - "多阶段训练时，每阶段结束用训练日志里的通过率剔除高于 0.9 的题，防止分布向简单端漂移。"
  builds_on: [deepscaler, dapo]
  tags: [难度分布, 课程, 采样温度]

- id: limr
  title: "LIMR: Less is More for RL Scaling"
  short: LIMR
  kind: paper
  org: 上海交通大学 · SII · GAIR
  authors: "Xuefeng Li et al."
  date: 2025-02
  arxiv: "2502.11886"
  repo: GAIR-NLP/LIMR
  areas: [rl-llm]
  facets: [data]
  tier: rec
  evidence: [open-source, ablation]
  evidence_note: "LIM 工具、训练与评测代码、数据和模型开源；与全量、随机、线性进步三种选法做了对照。实验只在 Qwen2.5-Math-7B 与 MATH 系列基准上完成，而这一组合后来被指出有污染风险，其他模型族上的外部复现仍少。"
  summary: "用学习影响度（LIM）挑 RL 数据：按每题奖励曲线与平均曲线的吻合度打分，在 Qwen2.5-Math-7B 上用 8,523 题中的 1,389 题追平全量，同规模随机子集明显更差。"
  plain: "先让模型把所有题练一轮，看哪些题的进步节奏和整体最同步，只留这些“带得动学习”的题；数据只用约六分之一，效果不降。"
  takeaways:
    - "RL 提示集先去冗余再谈扩量：同样约 1.4K 题，挑过的和随机抽的差距，远大于挑过的和全量之间的差距。"
    - "LIM 要先完整训练一次才能打分，更适合给下一轮训练或同系列模型筛数据；换模型族要重新验证。"
    - "结论来自 Qwen2.5-Math-7B 与 MATH 系列评测，复用前先在干净基准或其他模型族上复核。"
  builds_on: [limo]
  tags: [数据选择, RL 数据效率, Qwen2.5-Math]
