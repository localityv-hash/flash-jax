- id: ppo
  title: "Proximal Policy Optimization Algorithms"
  short: PPO
  kind: paper
  org: OpenAI
  authors: "John Schulman et al."
  date: 2017-07
  arxiv: "1707.06347"
  areas: [classic-rl, rl-llm]
  facets: [algorithm]
  tier: must
  evidence: [industrial, adopted, ablation, community]
  evidence_note: "OpenAI 在 InstructGPT 中用 PPO 完成 RLHF；Tülu 3 的 RLVR、Open-Reasoner-Zero、VAPO 与 Seed1.5-Thinking 仍以 PPO 为骨架；GRPO、DAPO 沿用它的裁剪代理目标，CISPO 则改为裁剪重要性权重。原文在 MuJoCo 与 Atari 上对比了多种代理目标。"
  summary: '提出裁剪代理目标 $\min\big(\rho\hat A,\ \clip(\rho,1-\varepsilon,1+\varepsilon)\hat A\big)$，让同一批样本可安全地做多轮小批量更新，兼得 TRPO 的稳定与一阶优化的简单。'
  plain: '每次更新只允许新策略在旧策略附近挪一小步：比率超出 $1\pm\varepsilon$ 的那部分收益不再计入，防止一次学太猛把模型带歪。'
  takeaways:
    - '在 LLM 上用 PPO 时，把 $\varepsilon$、GAE 的 $\lambda$ 和价值模型初始化当作一等超参：Open-Reasoner-Zero 发现推理 RL 中 $\lambda=1$ 比 $\lambda=0.95$ 稳定得多。'
    - "显存吃紧或奖励只在序列末尾出现时，先用 GRPO、RLOO 这类无 critic 方法建立基线，再决定是否值得维护价值网络。"
  builds_on: [trpo]
  tags: [策略梯度, 信任域, 裁剪]

- id: instructgpt
