# ───────────── 2026：新近值得跟踪 ─────────────

- id: fim-midtraining
  title: "Function-Aware Fill-in-the-Middle as Mid-Training for Coding Agent Foundation Models"
  short: FIM 中训练
  kind: paper
  org: TIGER-Lab（University of Waterloo）
  date: "2026-07"
  arxiv: "2607.12463"
  repo: TIGER-AI-Lab/FIM-Midtraining
  areas: [mid-training, agentic-rl]
  facets: [data]
  tier: ref
  evidence: [ablation, open-source]
  evidence_note: "2026-07 的新工作：语料（40 万样本）、六个检查点与数据构建流水线全部开源；在三种基座、三条现成智能体后训练流水线上做了“同一流水线、有无中训练”的成对对照，尚待外部复现。"
  summary: "按程序依赖图挑出复杂且可推断的函数挖空，让模型先写推理再补全函数体，作为代码智能体的中训练（约 2.6B token）；接上三条现成后训练流水线后，SWE-bench Verified 提升 2.8–5.3 分。"
  plain: "写代码的智能体每一步都是“调用—拿结果—接着写”，和普通代码里的函数调用长得一样；先拿海量代码练“补函数”，再学当智能体就更顺。"
  takeaways:
    - "评估中训练收益要自己复现“无中训练”基线，并走同一套后训练与评测框架，别拿论文报告值对比。"
  tags: [代码智能体, FIM, SWE-bench]

- id: kd-midtraining
  title: "Knowledge Distillation During Mid-Training Favors Reasoning over Factual Recall"
  short: 中训练蒸馏
  kind: paper
  org: Meta FAIR 等
  authors: "Jacqueline He et al."
  date: "2026-09"
  arxiv: "2609.01532"
  repo: facebookresearch/midtraining-distillation
  areas: [mid-training, opd]
  facets: [algorithm]
  tier: ref
  evidence: [ablation, open-source]
  evidence_note: "2026-09 的新工作，代码开源；以 OLMo-2 1B 为学生、7B 为教师，在 Dolmino 语料上做约 60B token 的中训练对照，并对每个检查点跑 Tulu-3 式后训练，检验收益能否保留。规模较小，尚待更大模型验证。"
  summary: "中训练阶段做蒸馏会以事实召回（TriviaQA、NQ）换推理（GSM8K、MATH），从零预训练则无此代价；Switch Distillation 只把教师熵最低的 20% token 交给反向 KL、其余用交叉熵，两头兼顾。"
  plain: "中训练时让大模型手把手教小模型，推理变强了、记事实却变差；只在大模型“很有把握”的那些词上跟着学，就能两头兼顾。"
  takeaways:
    - "中训练里用蒸馏时，同时盯推理与事实召回两类指标，别只看推理分。"
