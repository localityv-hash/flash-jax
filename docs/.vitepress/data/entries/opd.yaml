- id: revisiting-opd
  title: "Revisiting On-Policy Distillation: Empirical Failure Modes and Simple Fixes"
  short: Revisiting OPD
  kind: paper
  org: 中国科学院自动化研究所
  authors: "Yuqian Fu, Haohuan Huang et al."
  date: 2026-03
  venue: COLM 2026
  arxiv: "2603.25562"
  repo: hhh675597/revisiting_opd
  areas: [opd]
  facets: [algorithm]
  tier: rec
  evidence: [ablation, open-source]
  evidence_note: "COLM 2026；基于 verl-agent 的代码开源，数学推理与 ALFWorld 智能体多任务都有配置；理论上比较了 token 级与序列级估计的偏差和方差，并逐项消融三个修复。"
  summary: "指出采样 token 式 OPD 在长程任务上的三种失效：信号只落在一个 token 上、教师在学生前缀上越来越不可靠、tokenizer 与特殊 token 不匹配；对应给出教师 top-K 截断反向 KL、top-p 采样、特殊 token 掩码。"
  plain: "只拿学生写下的那一个字问老师“你给几分”，信息太少也太吵；改成在老师最看好的几十个候选上整体比较，训练稳得多。"
  takeaways:
    - "长回答上，用教师 top-K（例如 32）截断并归一化后的反向 KL，比单个采样 token 的估计更稳。"
    - "<think> 这类特殊 token 在师生间切分或含义不同时，先从 KL 里掩掉。"
    - "token 级 OPD 相对序列级反向 KL 有偏，但方差上界紧得多，这正是大家默认折扣为 0 的理由。"
  builds_on: [tm-opd]
  tags: [失效模式, top-K]

- id: rethinking-opd
  title: "Rethinking On-Policy Distillation of Large Language Models: Phenomenology, Mechanism, and Recipe"
  short: Rethinking OPD
  kind: paper
  org: 清华大学 · 上海科技大学 · UIUC · 中国人民大学
  authors: "Yaxuan Li et al."
  date: 2026-04
  venue: ICML 2026 FoGen Workshop
  arxiv: "2604.13016"
  repo: thunlp/OPD
  areas: [opd]
  facets: [theory, algorithm]
  tier: rec
  evidence: [adopted, ablation, open-source]
  evidence_note: "MiniCPM5-1B 的 OPD 明确采用了它的实现改进（在师生 top-k 并集上算反向 KL）；它的 top-k 重叠诊断已合入 verl（distillation/overlap_ratio 等指标）；代码开源。"
  summary: "系统研究 OPD 何时成败：师生思维模式要兼容，教师还要带来学生没见过的新能力；成功时学生访问状态上的高概率 token 逐步对齐，师生共享的小集合占 97%–99% 的概率质量。"
  plain: "老师得讲学生听得懂的话，还得讲学生不会的东西；缺一条，OPD 就学不动。"
  takeaways:
    - "OPD 不涨时先查两件事：师生思维模式是否一致（不一致就先做一段离线蒸馏冷启动），教师是否真有学生没见过的能力。"
    - "按教师擅长的分布挑提示，比随机提示更容易救回失败的 OPD。"
    - "监控师生 top-k 重叠率：持续上升是健康信号，停滞说明信号没落到学生真正会走的状态上。"
  builds_on: [tm-opd]
  tags: [机制分析, 冷启动]

- id: self-distilled-reasoner
  title: "Self-Distilled Reasoner: On-Policy Self-Distillation for Large Language Models"
  short: OPSD
  kind: paper
  org: UCLA · HKU · Meta
  authors: "Siyan Zhao et al."
  date: 2026-01
  arxiv: "2601.18734"
  repo: siyan-zhao/OPSD
  areas: [opd]
  facets: [algorithm]
  tier: rec
  evidence: [ablation, open-source]
  evidence_note: "代码开源（基于 TRL 的 GOLD 训练器），2026-03 修复对话模板问题后重跑并更新了消融；是 2026 年大量“特权信息自蒸馏”工作的起点。"
  summary: "同一个模型既当学生又当老师：学生只看题目，老师额外看到参考解，在学生自己的轨迹上做逐 token 分布匹配；不需要更大的教师，报告相比 GRPO 有 4–8 倍的 token 效率。"
  plain: "让模型先闭卷做题，再让“偷看了答案的自己”逐字批改，不用请更大的老师。"
  takeaways:
    - "只有带参考答案的数据、没有更强教师时，可以用“看过答案的自己”当老师做 OPD。"
    - "“wait”“think”这类风格 token 的 KL 可能比数学 token 高 6–15 倍并主导梯度，需要逐 token 截断 KL。"
  builds_on: [tm-opd]
  tags: [自蒸馏, 特权信息]

- id: sdft
  title: "Self-Distillation Enables Continual Learning"
  short: SDFT
  kind: paper
  org: MIT · Improbable AI Lab · ETH Zürich
  authors: "Idan Shenfeld et al."
  date: 2026-01
  arxiv: "2601.19897"
  repo: idanshen/Self-Distillation
  links:
    - { label: Tinker 复现（sdft recipe）, url: https://github.com/thinking-machines-lab/tinker-cookbook/tree/main/tinker_cookbook/recipes/sdft }
  areas: [opd]
  facets: [algorithm]
  tier: rec
  evidence: [adopted, open-source]
  evidence_note: "Thinking Machines 在 tinker-cookbook 中做了复现并消融了 top-K=20 与静态教师两个近似；TRL 收录 SDFTTrainer；作者代码单卡 H200 可复现。注意作者 2026-04 的更正：论文结果实际用的是逐 token 前向 KL。"
  summary: "用“看过示范的自己”当老师，在学生自己的输出上做逐 token 蒸馏，把示范数据变成在线训练信号；在技能学习和知识获取上新任务精度高于 SFT、遗忘明显更少，并能顺序累积多项技能。"
  plain: "SFT 是让模型抄示范；SDFT 是让模型先自己写，再由看过示范的自己批改。学到新本事，旧本事忘得少。"
  takeaways:
    - "只有示范、没有奖励函数，又怕 SFT 洗掉旧能力时，SDFT 比 SFT 更稳。"
    - "复现时注意损失方向：作者说明论文结果用的是逐 token 前向 KL（类似 GKD），不是反向 KL。"
  builds_on: [gkd, tm-opd]
  tags: [持续学习, 自蒸馏]

- id: sdpo
  title: "Reinforcement Learning via Self-Distillation"
  short: SDPO
  kind: paper
  org: ETH Zürich · MPI-IS · MIT · Stanford
  authors: "Jonas Hübotter et al."
  date: 2026-01
  arxiv: "2601.20802"
  repo: lasgroup/SDPO
  areas: [opd, rl-llm]
  facets: [algorithm]
  tier: rec
  evidence: [adopted, open-source]
  evidence_note: "TRL 收录 SDPOTrainer（实验模块）；官方代码与训练日志公开；在科学推理、工具使用和 LiveCodeBench v6 上与强 RLVR 基线对照。"
  summary: "把环境返回的文字反馈（报错、评审意见）或同组的成功样本当特权上下文，让“看到反馈的自己”当老师，把逐 token 自蒸馏信号接进 RLVR；样本效率与最终精度都优于强 RLVR 基线。"
