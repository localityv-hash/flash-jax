  summary: "针对朴素 GRPO 的熵坍缩与奖励噪声，提出 clip-higher、动态采样、token 级损失、超长奖励塑形并去掉 KL；AIME24 由 30 逐项升到 50，步数只有 R1-Zero-Qwen-32B 的一半。"
