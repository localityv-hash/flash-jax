  summary: "给出构建网页信息检索智能体的四阶段流程：合成浏览数据、采样 ReAct 轨迹、SFT 冷启动、DAPO 强化学习；GAIA 与 WebWalkerQA 上 Pass@3 分别为 64.1% 与 62.0%。"
  plain: "先造一批需要上网查的难题，再让强模型示范几遍当教材，最后用 RL 让模型自己练熟。"
  takeaways:
