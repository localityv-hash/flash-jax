  title: "Inference-Time Scaling for Generalist Reward Modeling"
  short: DeepSeek-GRM
  kind: paper
  org: DeepSeek-AI · 清华大学
  authors: "Zijun Liu et al."
  date: 2025-04
  arxiv: "2504.02495"
  areas: [rl-llm]
  facets: [algorithm, eval]
  tier: rec
  evidence: [ablation, community]
  evidence_note: "DeepSeek 与清华合作，在多个奖励模型基准上对比标量 RM、成对 RM 与生成式 RM，并比较推理时扩展与训练时扩展；论文发布后被广泛引用。DeepSeek-V3.2、V4 在通用任务上都改用按 rubric 打分的生成式奖励模型，但报告没有说明是否直接沿用本文的 SPCT。"
  summary: "采用逐点生成式奖励模型：先为问题生成评判原则，再写批评并打分；用 SPCT（拒绝式微调 + 基于规则的在线 RL）训练，推理时并行采样并由元 RM 引导投票，使奖励质量随推理算力提升。"
  plain: "让“评委模型”先写评分标准、再逐条点评打分；多请几次评委，再请一位“评委的评委”筛掉不靠谱的意见，分数就更准。"
  takeaways:
    - "通用领域没有验证器时，生成式 RM 比标量 RM 更能利用推理算力：多次采样投票加元 RM 过滤是性价比高的升级路径。"
  tags: [生成式奖励模型, 推理时扩展, 评判原则]

