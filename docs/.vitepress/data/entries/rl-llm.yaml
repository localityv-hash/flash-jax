  title: "Constitutional AI: Harmlessness from AI Feedback"
  short: Constitutional AI
  kind: paper
  org: Anthropic
  authors: "Yuntao Bai et al."
  date: 2022-12
  arxiv: "2212.08073"
  repo: anthropics/ConstitutionalHarmlessnessPaper
  areas: [rl-llm]
  facets: [data, algorithm]
