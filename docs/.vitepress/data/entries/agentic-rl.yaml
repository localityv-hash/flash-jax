  evidence_note: "Meta FAIR 开放权重（非商用研究许可）的 32B 模型与技术报告；模型卡公开了中训练数据构成与三阶段训练流程，SWE-bench Verified 53.9%（测试时扩展 65.8%）。"
  summary: "32B 代码模型：预训练 8T token 后，在 131K 上下文用 5T token“代码世界模型”数据中训练（Python 执行轨迹、约 300 万条容器内智能体交互），再做 SFT 与覆盖编码、数学、多轮 SWE 的多任务 RL。"
  plain: "先让模型大量看代码执行时变量怎么变、命令敲下去系统怎么变，再用 RL 练它实际修代码。"
  takeaways:
