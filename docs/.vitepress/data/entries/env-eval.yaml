  summary: "职业工程师人工审核 SWE-bench 样本（共标注 1,699 条），剔除描述不清、测试不合理或无法解决的题，得到 500 道确认可解的子集，成为 2024–2026 年报告 SWE 能力的事实标准。"
  plain: "原来的 SWE-bench 里有些题本身有毛病：描述不清、测试过严。OpenAI 请工程师逐题把关，挑出 500 道“确定能做”的题，分数因此更可信。"
  takeaways:
