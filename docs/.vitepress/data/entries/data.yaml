  summary: "约 10.3 万道偏难（主要 5–9 级）的数学题，从多个来源筛出、与已有开源题集重合少，经语义匹配对常见基准去污染；每题附可验证答案、难度分、主题标签与三条 R1 解答。"
  plain: "专挑“难、而且答案能自动判对错”的数学题，并提前删掉和考试题撞车的，适合拿来做强化学习。"
  takeaways:
