# 训练系统横切视角（/lenses/infra）的条目：推理引擎、RL 训练框架、异步方案，
# 以及 2025 年下半年集中出现的训推不一致（mismatch）与 MoE 路由稳定性工作。
# 事实来源：各仓库 README / 文档、论文 arXiv 页面、作者博客；不手填任何指标。

# ---------- 推理引擎 ----------

- id: vllm
  title: "Efficient Memory Management for Large Language Model Serving with PagedAttention"
  short: vLLM
  kind: paper
  org: UC Berkeley
  authors: "Woosuk Kwon et al."
  date: 2023-06
  venue: SOSP 2023
  arxiv: "2309.06180"
  repo: vllm-project/vllm
  links:
    - { label: 发布博客, url: https://blog.vllm.ai/2023/06/20/vllm.html }
    - { label: Sleep Mode 文档, url: https://github.com/vllm-project/vllm/blob/main/docs/features/sleep_mode.md }
  areas: [rl-llm]
  facets: [infra]
  tier: must
  evidence: [industrial, adopted, open-source, community]
  evidence_note: "生产级开源推理引擎，也是 RL 框架最常用的 rollout 后端：OpenRLHF、verl、TRL、prime-rl、NeMo-RL、SkyRL 都用它生成样本；为 RL 专门提供了 sleep mode（释放权重与 KV cache）、在线权重更新接口和批不变推理模式（VLLM_BATCH_INVARIANT）。"
  summary: "用分页式 KV cache（PagedAttention）消除显存碎片并支持连续批处理，同等延迟下吞吐比当时的主流系统高 2–4 倍；在 RL 中负责生成 rollout，并通过 sleep/wake 与在线权重更新和训练引擎配合。"
  plain: "像操作系统管内存那样按页管理 KV cache，一张卡能同时服务更多请求。RL 里它就是“做题”的那一半：负责又快又多地生成回答。"
  takeaways:
    - "共置训练时开启 sleep mode：全量同步权重用 level 2（直接丢弃权重与 KV），只更新 LoRA 等部分权重时用 level 1。"
    - "要做重要性采样修正，就让引擎返回经温度与截断处理后的 logprob（processed logprobs），否则修正的分母本身就是错的。"
  tags: [推理引擎, PagedAttention, rollout]

- id: sglang
  title: "SGLang: Efficient Execution of Structured Language Model Programs"
  short: SGLang
  kind: paper
  org: LMSYS（Stanford · UC Berkeley 等）
  authors: "Lianmin Zheng et al."
  date: 2023-12
  arxiv: "2312.07104"
  repo: sgl-project/sglang
  links:
    - { label: 确定性推理与可复现 RL, url: https://lmsys.org/blog/2025-09-22-sglang-deterministic/ }
  areas: [rl-llm, agentic-rl]
  facets: [infra]
  tier: rec
  evidence: [industrial, adopted, open-source, community]
  evidence_note: "生产级推理引擎；slime 只用 SGLang 做 rollout，支撑智谱 GLM-4.5 起的 RL 训练；AReaL 以它为默认推理后端，verl、Miles 深度集成。为 RL 新增了 /abort_request（与 AReaL 团队共同设计，用于动态采样与部分 rollout）、分桶权重更新、返回 MoE 路由专家与确定性推理。"
  summary: "以 RadixAttention 在请求之间自动复用 KV 前缀，配合高效调度与结构化生成；同题多采样与多轮 agent 的前缀高度重叠，使它成为 RL rollout 的主流引擎之一。"
  plain: "同一道题采样 8 次、多轮对话每轮都带着前文——这些重复的开头只算一次、大家共用，生成自然就快了。"
  takeaways:
    - "多轮 agent rollout 配合会话亲和路由，让同一条轨迹的各轮落在同一实例上复用前缀缓存。"
    - "需要动态采样或部分 rollout 时，用 abort 接口中止请求并回收已生成内容，而不是等整批跑完。"
  tags: [推理引擎, RadixAttention, rollout]

# ---------- RL 训练框架 ----------

- id: deepspeed-chat
  title: "DeepSpeed-Chat: Easy, Fast and Affordable RLHF Training of ChatGPT-like Models at All Scales"
  short: DeepSpeed-Chat
  kind: report
  org: Microsoft DeepSpeed
  authors: "Zhewei Yao et al."
  date: 2023-04
  arxiv: "2308.01320"
  url: https://github.com/deepspeedai/DeepSpeedExamples/tree/master/applications/DeepSpeed-Chat
  areas: [rl-llm]
  facets: [infra]
  tier: rec
  evidence: [industrial, open-source, community]
  evidence_note: "微软 DeepSpeed 团队的生产级系统，2023 年开源后是 RLHF 系统的早期参照；LlamaRL 论文仍以“DeepSpeed-Chat 类系统”为对比基线。它的 Hybrid Engine 是后来训推共置设计的源头之一。如今新项目已很少直接采用，作为历史节点收录。"
  summary: "端到端复现 InstructGPT 三阶段（SFT、奖励模型、PPO）；Hybrid Engine 让同一份 actor 权重在 ZeRO 训练模式与张量并行推理模式之间切换，缓解 PPO 生成阶段的低效。"
  plain: "第一批把 ChatGPT 式 RLHF 做成“一键训练”的开源系统：同一套显卡一会儿当训练机，一会儿切成推理模式出题。"
  takeaways:
    - "读新框架的共置设计时拿 Hybrid Engine 当参照：核心问题始终是模式切换时权重如何重分片、显存如何腾挪。"
  tags: [RLHF, Hybrid Engine, 历史]

- id: openrlhf
  title: "OpenRLHF: An Easy-to-use, Scalable and High-performance RLHF Framework"
  short: OpenRLHF
  kind: paper
  org: OpenRLHF 社区
  authors: "Jian Hu et al."
  date: 2023-08
  arxiv: "2405.11143"
  repo: OpenRLHF/OpenRLHF
  areas: [rl-llm]
  facets: [infra]
  tier: rec
  evidence: [adopted, open-source, community]
  evidence_note: "最早把 Ray 调度与 vLLM 生成结合的开源 RLHF 框架；阶跃星辰与清华的 Open-Reasoner-Zero 明确基于它构建，HKUST 的 R1-Zero 小模型复现、LMM-R1、MARTI 等以它为底座或 fork。提供共置（hybrid engine + sleep）、异步、异步 + 部分 rollout 三种模式，内置截断式与掩码式 IS 修正。"
  summary: "用 Ray 把 actor、critic、奖励与参考模型调度到不同 GPU，vLLM 生成、DeepSpeed ZeRO-3 训练，经 NCCL 或 CUDA IPC 同步权重；后续加入共置、异步流水与 agent 执行器。"
  plain: "把 RLHF 里“出题、打分、改模型”的几个角色拆给不同显卡组，用 Ray 当调度员；卡不够时也能让它们挤在同一组卡上轮流干活。"
  takeaways:
    - "验证新算法先用 --train.colocate_all 的共置模式（严格 on-policy），确认收敛后再打开异步追求吞吐。"
    - "异步模式下用队列长度控制 off-policy 程度，并同时打开 token 级 IS 修正。"
  builds_on: [vllm]
  tags: [Ray, vLLM, DeepSpeed, RLHF]

- id: trl
  title: "TRL: Transformers Reinforcement Learning"
  short: TRL
  kind: project
  org: Hugging Face
  date: 2020-03
  repo: huggingface/trl
  url: https://huggingface.co/docs/trl/index
  areas: [rl-llm, sft]
  facets: [infra]
  tier: rec
  evidence: [industrial, open-source, community]
  evidence_note: "Hugging Face 官方后训练库，SFTTrainer、DPOTrainer、GRPOTrainer 被大量教程与开源复现（如 Open-R1）使用；vLLM 生成支持共置（默认）与独立 server 两种模式，server 模式经 NCCL 推送权重，并对 vLLM 生成默认开启截断重要性采样修正训推差异。"
  summary: "基于 Transformers 与 Accelerate 的后训练库，覆盖 SFT、DPO、GRPO、RLOO 等；用 vLLM 加速在线生成，内置训推差异监控与 TIS/MIS 修正，适合中小规模实验与教学。"
  plain: "Hugging Face 生态里最顺手的后训练工具箱：几行代码就能跑 SFT、DPO 或 GRPO；规模上去以后再换专门的大规模框架。"
  takeaways:
    - "单机到几台机器的小模型实验首选；上百卡或大 MoE 时迁移到 verl、slime 等支持 Megatron 的框架。"
    - "盯住 sampling/sampling_logp_difference 这类指标：它持续上升说明训推差异在变大。"
  tags: [GRPO, DPO, SFT, vLLM]

- id: verl
  title: "HybridFlow: A Flexible and Efficient RLHF Framework"
  short: verl
  kind: paper
  org: 字节跳动 Seed · 香港大学
  authors: "Guangming Sheng et al."
  date: 2024-09
  venue: EuroSys 2025
  arxiv: "2409.19256"
  repo: verl-project/verl
  url: https://verl.readthedocs.io/en/latest/
  areas: [rl-llm, agentic-rl]
  facets: [infra]
  tier: must
  evidence: [industrial, adopted, ablation, open-source, community]
  evidence_note: "字节 Seed 用它训练 Doubao-1.5-pro 的 RL 预览模型与 Seed-Thinking-v1.5，DAPO、VAPO 基于它；昆仑万维 Skywork-OR1 用其 fork 训练；美团贡献了 one-step-off 与全异步训练器，Mind Lab 用它做万亿参数模型的 LoRA RL。社区最活跃的开源 RL 框架之一，2026 年迁入 verl-project 组织。"
  summary: "混合控制器编程模型：单控制器编排数据流、多控制器执行计算；3D-HybridEngine 在训练与生成间就地重分片 actor 权重。后端覆盖 FSDP/Megatron × vLLM/SGLang，并扩展出异步训练与 agent loop。"
  plain: "算法流程写在一个“总指挥”脚本里，繁重的计算交给分布在各卡上的工人；同一份模型在训练形态和推理形态之间就地变身，不必各存一份。"
  takeaways:
    - "从同步共置起步：先跑通官方 GRPO/DAPO 示例，再按 rollout 耗时占比决定是否切到 one-step-off 或 fully_async。"
    - "打开 rollout correction 的诊断指标；训推差异升高时先用 token 级 TIS，长序列上恶化再换序列级掩码。"
  builds_on: [deepspeed-chat]
  tags: [HybridFlow, FSDP, Megatron, 异步]

