# ---------- 训推不一致与数值稳定性 ----------

- id: tis-offpolicy
  title: "Your Efficient RL Framework Secretly Brings You Off-Policy RL Training"
  short: TIS
  kind: blog
  org: UCSD · Microsoft Research
  authors: "Feng Yao, Liyuan Liu et al."
  date: 2025-08
  url: https://fengyao.notion.site/off-policy-rl
  repo: yaof20/Flash-RL
  links:
    - { label: 后续论文 On the Rollout-Training Mismatch, url: https://opt-ml.org/papers/2025/paper116.pdf }
  areas: [rl-llm]
  facets: [infra, algorithm]
  tier: must
  evidence: [adopted, open-source, community]
  evidence_note: "引发 2025 年下半年“训推不一致”讨论的起点：TRL 的 GRPOTrainer 对 vLLM 生成默认开启 TIS，verl（rollout correction）、OpenRLHF、slime/Miles、NeMo-RL 都实现了同类修正；Qwen 团队的 Stabilizing RL with LLMs 把它纳入统一的理论解释。配套 Flash-RL 仓库提供精确的 rollout logprob 与 FP8/INT8 量化 rollout。"
  summary: "指出 vLLM 生成 + FSDP 训练的系统即使权重相同，token 概率也显著不同，等于隐性 off-policy 训练；提出截断重要性采样 min(π_train/π_rollout, C) 修正，也让量化 rollout 能稳定训练。"
  plain: "出题用的“快速版模型”和改卷用的“标准版模型”算出的概率不一样，相当于拿别人的卷子来学。给每个词乘一个有上限的修正系数，把偏差补回来。"
  takeaways:
    - "凡是“推理引擎生成、训练引擎重算”的系统，都应保存 rollout logprob 并默认开启 token 级 TIS。"
    - "想用量化 rollout 提速时，TIS 是必要配套而不是可选项。"
  tags: [训推不一致, 重要性采样, 量化 rollout]

- id: rl-collapse-mismatch
  title: "When Speed Kills Stability: Demystifying RL Collapse from the Training-Inference Mismatch"
  short: 序列级 MIS
  kind: blog
  org: 个人技术博客
  authors: "Jiacai Liu, Yingru Li et al."
  date: 2025-09
  url: https://richardli.xyz/rl-collapse
  links:
    - { label: verl rollout correction 理论文档, url: https://github.com/verl-project/verl/blob/main/docs/algo/rollout_corr_math.md }
    - { label: 后续论文 Trust Region Masking, url: https://arxiv.org/abs/2512.23075 }
  areas: [rl-llm]
  facets: [algorithm, infra, theory]
  tier: rec
  evidence: [adopted, community]
  evidence_note: "三篇系列博客，用 TV 距离刻画偏差、χ² 散度刻画方差来分析训推不一致；verl 的 rollout correction 以它为理论文档并内置 Seq-MIS、Geo-RS 等预设，Miles 的训推不一致专文推荐 MIS 作为稳健默认，TRL 也实现了 MIS。后续整理为论文 Trust Region Masking（arXiv 2512.23075）。"
  summary: "说明训推差异不小时 token 级 IS 修正的偏差随长度增长，序列级 IS 无偏但方差随长度爆炸；提出超界即整条丢弃的序列级掩码 IS（MIS）与按几何平均比率过滤的 Geo-RS，避免长回答被系统性误伤。"
  plain: "按词修正会越攒越偏，按整句修正又波动太大；干脆设一道门槛：整句偏离太多的样本直接不学。为了不冤枉长回答，门槛看的是“平均每个词偏了多少”。"
  takeaways:
    - "长 CoT 或多轮 agent 训练中，训推差异上升时从 token 级 TIS 升级到序列级 MIS 或 Geo-RS。"
    - "过滤阈值用几何平均比率而不是比率乘积，否则长回答会被系统性丢弃。"
  builds_on: [tis-offpolicy]
  tags: [训推不一致, 掩码重要性采样, 长序列]

- id: fp16-mismatch
  title: "Defeating the Training-Inference Mismatch via FP16"
  short: FP16 修训推差
  kind: paper
  org: Sea AI Lab · 新加坡国立大学
  authors: "Penghui Qi et al."
  date: 2025-10
  arxiv: "2510.26788"
  repo: sail-sg/Precision-RL
  areas: [rl-llm]
  facets: [infra, algorithm]
  tier: rec
  evidence: [ablation, open-source]
  evidence_note: "在 VeRL 与 Oat 两套框架、GRPO/GSPO/TIS/MIS/PG 多种算法、R1-Distill/Qwen/OctoThinker 多个模型族以及 LoRA、Dense-14B 与 MoE 上一致复现 FP16 优于 BF16；仓库给出 VeRL 的最小补丁，verl 随后正式支持 FSDP 与 Megatron（稠密模型）的 FP16 训练。"
  summary: "把训推不一致的根源归到 BF16 尾数太短（7 位）导致的舍入误差；训练与推理统一改用 FP16（10 位尾数）即可大幅降低训推概率差，训练更稳、收敛更快，无需改动模型结构或算法。"
  plain: "BF16 能表示很大很小的数，但每个数都“四舍五入得很粗”；FP16 范围小一些，却精细得多。RL 后训练用不到那么大的范围，换成 FP16 反而两边算得更一致。"
  takeaways:
    - "稠密模型 RL 出现训推差异时，先试把训练与推理都切到 FP16（配合损失缩放），代价往往只是几行配置。"
    - "MoE 的 FP16 支持仍在完善，切换前先确认训练框架（如 Megatron）的实现状态。"
  builds_on: [tis-offpolicy]
  tags: [训推不一致, 数值精度, FP16]

- id: tm-nondeterminism
  title: "Defeating Nondeterminism in LLM Inference"
  short: 批不变推理
  kind: blog
  org: Thinking Machines Lab
  authors: "Horace He et al."
  date: 2025-09
  url: https://thinkingmachines.ai/blog/defeating-nondeterminism-in-llm-inference/
  repo: thinking-machines-lab/batch_invariant_ops
  links:
    - { label: SGLang 确定性推理, url: https://lmsys.org/blog/2025-09-22-sglang-deterministic/ }
    - { label: vLLM × TorchTitan 比特一致 RL, url: https://blog.vllm.ai/2025/11/10/bitwise-consistent-train-inference.html }
  areas: [rl-llm]
  facets: [infra, theory]
  tier: rec
  evidence: [adopted, open-source, community]
  evidence_note: "Thinking Machines Lab 的 Connectionism 博客首篇，发布后被广泛讨论；约两周后 SGLang 基于其 kernel 实现确定性推理，并与 slime 做到两次独立 RL 运行曲线完全一致；vLLM 推出批不变模式并与 TorchTitan 演示训推比特一致的 RL；Miles 的 true on-policy 模式同样基于这批 kernel。"
  summary: "论证推理非确定性的主因不是笼统的“GPU 并发 + 浮点误差”，而是 kernel 缺乏批不变性：归约顺序随批大小变化，而服务端批大小随负载波动；给出批不变的 RMSNorm、矩阵乘与注意力，并演示训推 KL 恒为 0 的真 on-policy RL。"
  plain: "同一个问题和不同的“邻居”拼进一个批里算，加法的先后顺序就变了，结果末位就不同。把计算顺序固定下来，不管和谁拼批，答案都一模一样。"
  takeaways:
    - "需要可复现、或要判断训推差异是不是 bug 时，打开引擎的确定性 / 批不变模式做对照实验；大规模训练先评估吞吐代价。"
    - "报告温度 0 的评测结果时要意识到：未开启批不变模式时，同一提示在不同负载下可能给出不同输出。"
  tags: [确定性推理, 批不变性, 真 on-policy]

- id: rollout-routing-replay
  title: "Stabilizing MoE Reinforcement Learning by Aligning Training and Inference Routers"
  short: R3 路由回放
  kind: paper
  org: 小米 · 北京大学
  authors: "Wenhan Ma et al."
  date: 2025-10
  arxiv: "2510.11370"
  areas: [rl-llm]
  facets: [infra, algorithm]
  tier: rec
  evidence: [adopted, ablation, community]
  evidence_note: "verl、ROLL、slime/Miles、prime-rl、NeMo-RL 均已内置 router replay，SGLang 与 vLLM 提供返回路由专家的接口；verl 文档称 DeepSeek-V3.2、GLM-5、MiMo-V2 等均采用 R3 式路由回放，prime-rl 文档称它能把训推差异降低一个数量级。论文在 MoE 上与 GSPO、TIS 做了对比。"
  summary: "发现 MoE 在训练与推理阶段的路由选择明显不一致，是 RL 崩溃的重要来源；提出 Rollout Routing Replay（R3）：记录推理引擎为每个 token 选的专家，训练前向复用同一组专家，显著降低训推 KL 且几乎不影响速度。"
  plain: "MoE 像医院分诊台：推理时把某个词分给了 3 号和 7 号专家，训练时却因为一点数值误差分给了 3 号和 9 号，学到的就不是同一回事。R3 让训练照抄推理时的分诊记录。"
  takeaways:
    - "MoE 模型做 RL 默认开启 R3；训练端仍用自己的 router logits 在回放的专家集合上做 softmax，路由器照常得到梯度。"
    - "评估工程代价：每个 token × 每层 × top-k 的专家索引要随样本传输，部分框架暂不支持与 sequence packing 或 P/D 分离同时使用。"
  builds_on: [gspo]
  tags: [MoE, 路由回放, 训推不一致]
