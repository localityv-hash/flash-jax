- id: smollm3
  title: "SmolLM3: smol, multilingual, long-context reasoner"
  short: SmolLM3
  kind: blog
  org: Hugging Face
  authors: "Elie Bakouch et al."
  date: "2025-07-08"
  url: "https://huggingface.co/blog/smollm3"
  repo: huggingface/smollm
  links:
    - { label: 训练配置, url: "https://huggingface.co/datasets/HuggingFaceTB/smollm3-configs" }
  areas: [mid-training]
  facets: [data]
  tier: rec
  evidence: [industrial, ablation, open-source, community]
  evidence_note: "Hugging Face 正式发布 3B 模型时附带的完整配方：各阶段配比、学习率、长上下文与推理中训练、模型合并都写明，训练配置公开，是 2025 年传播最广的全开源训练手册之一。消融多在 3B、50B–100B token 规模上完成。"
  summary: "3B 模型约 11T token 三阶段预训练（WSD，衰减期上调代码与数学）；随后的长上下文适配（4K→64K，共 100B）与推理中训练（约 140B token）被统称为中训练，后者损伤的长文能力靠模型合并补回。"
  plain: "一份小模型的完整菜谱：主餐三道，收尾再加两道专项小灶（读长文、学推理）；小灶吃伤了长文胃口，就用“合并模型”调回来。"
  takeaways:
    - "推理中训练和长上下文能力会互相干扰：做完要复测 RULER 类长文基准，必要时与长上下文检查点线性合并（SmolLM3 用 0.9/0.1）。"
    - "若已用 NoPE / 大 RoPE θ 并在长序列上训练衰减期配比，不一定要专门上采样代码仓库、书籍等长数据。"
  builds_on: [minicpm, fineweb, megamath]
  tags: [WSD, 推理中训练, 长上下文, 模型合并]

# ───────────── 长上下文扩展 ─────────────

- id: yarn
  title: "YaRN: Efficient Context Window Extension of Large Language Models"
  short: YaRN
  kind: paper
  org: Nous Research · EleutherAI · University of Geneva
  authors: "Bowen Peng, Jeffrey Quesnelle, Honglu Fan, Enrico Shippole"
  date: "2023-08"
  venue: ICLR 2024
  arxiv: "2309.00071"
  repo: jquesnelle/yarn
  areas: [mid-training]
  facets: [algorithm]
  tier: must
  evidence: [adopted, ablation, open-source, community]
  evidence_note: "事实标准的 RoPE 扩展方法：DeepSeek-V3（代码中 s=40、β_fast=32、β_slow=1）、Qwen2.5 / Qwen3（YaRN + DCA 推理期 4 倍外推）、Kimi K2（扩到 128K）、Olmo 3（8K→64K）、SmolLM3 都在技术报告或官方代码里明确使用。"
  summary: "按 RoPE 各维度的波长区别对待：波长远短于原上下文的高频维度不插值，波长超过上下文的低频维度按比例 s 插值，中间线性过渡（NTK-by-parts）；再给注意力 logit 乘一个随 ln s 增长的系数。约 0.1% 预训练量的微调即可把窗口扩展数倍。"
  plain: "位置编码像一组转速不同的指针：快指针在训练里早已转满很多圈，不用动；慢指针还没转满一圈，就按比例放慢，免得出现没见过的角度。"
  takeaways:
    - "扩上下文优先用 YaRN 或调大 RoPE base，而不是朴素的位置插值；Llama 系可直接用 α=1、β=32。"
    - "推理时想超过训练长度，可以叠加 YaRN / Dynamic NTK 外推，但必须在目标长度上实测。"
  tags: [RoPE, 长上下文, 位置编码]

- id: prolong
  title: "How to Train Long-Context Language Models (Effectively)"
  short: ProLong
  kind: paper
  org: Princeton University
  authors: "Tianyu Gao, Alexander Wettig, Howard Yen, Danqi Chen"
  date: "2024-10"
  venue: ACL 2025
  arxiv: "2410.02660"
  repo: princeton-nlp/ProLong
  areas: [mid-training]
  facets: [data, eval]
  tier: rec
  evidence: [ablation, open-source, community]
  evidence_note: "长上下文训练最系统的公开消融之一：长数据来源、长短配比、训练长度、RoPE base、SFT 数据都有对照；模型、打包好的 64K / 512K 训练数据与训练脚本（含逐域配比）全部开源，评测改用 HELMET 并在 SFT 之后进行。"
  summary: "从 Llama-3-8B-Instruct 续训 40B token 得到 512K 上下文模型。结论：代码仓库与书籍是好的长数据，但要混约四成高质量短数据；训练长度超过评测长度有益；SFT 只用短指令数据就够。"
  plain: "教模型读长书，光给长书不够，要夹着短文章一起读，否则短文能力会退化；考试也别只考“找针”，要考真正的长文理解。"
  takeaways:
    - "长上下文配比可从“约 60% 长数据（代码仓库 + 书籍）+ 40% 高质量短数据”起步。"
    - "用 SFT 之后的下游长文任务（如 HELMET）评估，别只看困惑度和大海捞针。"
  builds_on: [llama3]
  tags: [长上下文, RoPE base, HELMET, 数据配比]

- id: deepseek-v3
  title: "DeepSeek-V3 Technical Report"
  short: DeepSeek-V3
  kind: report
  org: DeepSeek
  authors: "DeepSeek-AI"
  date: "2024-12"
  arxiv: "2412.19437"
  repo: deepseek-ai/DeepSeek-V3
  links:
    - { label: V3.1 模型卡（扩展阶段加量）, url: "https://huggingface.co/deepseek-ai/DeepSeek-V3.1" }
  areas: [mid-training]
  facets: [algorithm, data]
  tier: must
  evidence: [industrial, adopted, open-source, community]
  evidence_note: "DeepSeek-V3 / R1 系列的底座报告，权重与推理代码开源（inference/model.py 中可直接看到 YaRN 的 s=40、β_fast=32、β_slow=1 与注意力缩放）。Kimi K2 的架构明确沿用 DeepSeek-V3 的设计；V3.1 沿用同一套两段扩展，并把 32K / 128K 两段加到 630B / 209B token。"
  summary: "14.8T token 预训练：学习率恒定到 10T，再 4.3T 余弦衰减，最后 500B 分两段常数；随后用 YaRN 分两段各 1000 步，把上下文从 4K 扩到 32K 再到 128K，学习率沿用预训练末值。"
  plain: "先用大学习率跑到 10T，再慢慢降，最后两小段“定型”；扩长文时不重新训练，只用很少的步数分两级把窗口拉长。"
  takeaways:
    - "长上下文扩展可以放在预训练之后单独做，学习率沿用预训练末值，分两级（如 32K→128K）逐步拉长。"
    - "扩展阶段的 token 预算值得加：V3.1 把两段分别加到 630B / 209B token。"
  builds_on: [yarn]
  tags: [YaRN, 学习率调度, 长上下文, MoE]

# ───────────── 面向后训练（RL / 智能体）的中训练 ─────────────

- id: octothinker
  title: "OctoThinker: Mid-training Incentivizes Reinforcement Learning Scaling"
  short: OctoThinker
  kind: paper
  org: 上海交通大学 GAIR
  authors: "Zengzhi Wang, Fan Zhou, Xuefeng Li, Pengfei Liu"
  date: "2025-04"
  arxiv: "2506.20512"
  repo: GAIR-NLP/OctoThinker
  links:
    - { label: MegaMath-Web-Pro-Max 数据, url: "https://huggingface.co/datasets/OctoThinker/MegaMath-Web-Pro-Max" }
  areas: [mid-training, rl-llm]
  facets: [data, algorithm]
  tier: must
  evidence: [adopted, ablation, open-source, community]
  evidence_note: "2025-04 先以 Notion 博客与模型发布，2025-06 发布技术报告。AI2 按其 MegaMath-Web-Pro-Max 的改写配方重新生成了 MegaMatt，放进 Olmo 3 的中训练配比（dolma3 仓库有说明）；论文在 Llama-3.2 上对语料、QA 格式、指令数据、长短 CoT 与学习率调度做了成组消融，模型、代码与数据开源。"
  summary: "探究 Llama 为何比 Qwen 难做 RL：优质数学语料（MegaMath-Web-Pro）同时抬高 base 与 RL；QA 式长 CoT 与指令数据再加分，但长 CoT 易致冗长与不稳；据此提出 Stable-then-Decay 两段中训练。"
  plain: "同样参加“RL 集训”，有的学生一点就通、有的怎么练都不进步；差别在集训前的“预习”：预习材料质量高、题型贴近考试，集训效果才好。"
  takeaways:
    - "RL 不涨时先查 base：用小规模 RL 探针比较不同中训练配方，而不是只调 RL 超参。"
    - "中训练加入 QA 式推理数据与少量指令数据，但控制长 CoT 比例，避免 RL 阶段回复冗长、训练不稳。"
  builds_on: [megamath, minicpm]
  tags: [RL-ready, Llama vs Qwen, Stable-then-Decay, 数学语料]

- id: agentfounder
  title: "Scaling Agents via Continual Pre-training"
  short: AgentFounder
  kind: paper
  org: 阿里巴巴通义实验室
  authors: "Su et al."
  date: "2025-09"
  arxiv: "2509.13310"
  repo: Alibaba-NLP/DeepResearch
  areas: [mid-training, agentic-rl]
  facets: [data]
  tier: rec
  evidence: [industrial, ablation]
  evidence_note: "同团队已开源的 Tongyi DeepResearch（30B-A3B）在技术报告中把两阶段 Agentic CPT 作为核心中训练阶段；论文给出数据量与模型规模的扩展曲线。合成数据本身未公开。"
  summary: "在后训练前插入智能体继续预训练（Agentic CPT）：基于开放世界记忆合成问题及规划、推理、决策动作数据，先 32K 再 128K 两阶段训练；AgentFounder-30B 在 BrowseComp-en/zh 达 39.9%/43.3%。"
  plain: "先让模型大量“看”智能体怎么拆问题、怎么决策（仍是预测下一个词），再去做强化学习，就不用在 RL 里同时学“怎么当智能体”和“怎么做对”。"
  takeaways:
    - "深度研究类智能体的后训练总学不稳时，考虑先用合成的规划 / 推理 / 决策轨迹做一段继续预训练。"
    - "智能体中训练里也要穿插少量通用预训练数据，防止通用能力被侵蚀。"
  tags: [Agentic CPT, 深度研究, 数据合成]

- id: front-loading-reasoning
  title: "Front-Loading Reasoning: The Synergy between Pretraining and Post-Training Data"
  short: Front-Loading Reasoning
  kind: paper
  org: NVIDIA · CMU · Boston University · Stanford
  authors: "Syeda Nahida Akter et al."
  date: "2025-10"
  venue: ICLR 2026
  arxiv: "2510.03264"
  areas: [mid-training, sft]
  facets: [data]
  tier: rec
  evidence: [ablation, community]
  evidence_note: "NVIDIA 主导、ICLR 2026 接收；从零训练 8B 模型 1T token，再在 SFT 与 RL 两段做全交叉对照，是少见的“预训练 × 后训练数据分配”控制实验。代码未公开，结论来自单一团队。"
  summary: "在固定推理数据预算下比较放进预训练还是后训练：前置到预训练带来 19% 平均增益，且后续 SFT 加数据也补不回；预训练更吃推理数据的多样性（11%），SFT 更吃质量（15%）；高质量预训练数据有“潜伏效应”，SFT 后才显现。"
  plain: "推理能力像地基，越早打越牢；预训练阶段要见多识广，SFT 阶段要精挑细选。"
  takeaways:
    - "推理数据不要全留给 SFT：在预训练后段或中训练就混入多样的推理语料。"
    - "SFT 数据宁精勿滥：盲目扩充中等质量的 SFT 数据，可能冲掉前期注入推理数据的收益。"
  tags: [推理数据, 数据分配, 预训练 vs SFT]

- id: midtraining-bridges
  title: "Midtraining Bridges Pretraining and Posttraining Distributions"
  short: Midtraining Bridges
  kind: paper
  org: Carnegie Mellon University
  authors: "Emmy Liu, Graham Neubig, Chenyan Xiong"
  date: "2025-10"
  venue: ICML 2026 Oral
  arxiv: "2510.14865"
  repo: nightingal3/midtraining
  areas: [mid-training]
  facets: [theory, data]
  tier: rec
  evidence: [ablation, open-source, community]
  evidence_note: "ICML 2026 Oral；在从零预训练的 Pythia 系小模型上做可控实验（仓库里有 70M–160M 的时机与配比消融配置）。规模小但变量控制干净，是少有的专门解释“中训练为什么有效”的工作。"
  summary: "把中训练看成预训练与后训练分布之间的桥：数学、代码等与通用语料差距最大的领域收益最大；相比只用专门数据继续预训练，中训练的域内损失更低、后训练后遗忘更少；插入时机比混合比例更重要，越早越好。"
  plain: "从“读百科”直接跳到“做编程题”跨度太大；中间先读些带代码的教程过渡，学得更快、忘得更少。"
  takeaways:
    - "目标领域离通用语料越远（数学、代码），越值得单独安排中训练。"
    - "与其纠结专门数据占 10% 还是 30%，不如先把它提前引入，并保留通用数据混合以减少遗忘。"
  tags: [分布桥接, 遗忘, 继续预训练]

- id: olmo3
  title: "Olmo 3"
