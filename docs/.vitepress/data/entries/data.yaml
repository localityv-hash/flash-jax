  areas: [rl-llm]
  facets: [data]
  tier: rec
  evidence: [open-source, community]
  evidence_note: "过滤信号、语义去重与选择题改写的代码全部开源，每一步过滤都可以在仓库里复现；是较早专门为 RL 构建的大规模开源数学题集之一，常被后续 RLVR 数据工作用作数据源和对照。"
  summary: "专为 RL 构建的数学题集：用规则与模型信号剔除选择、判断、证明、多小问等不易验证的题，做语义去重，把部分选择题改写成开放式问题，并附 Llama-3.1-8B 采样 64 次的解题率。"
  plain: "只留下“答案唯一、能自动核对、没法靠蒙”的数学题，并标出每道题对一个 8B 模型有多难，方便按难度挑题。"
  takeaways:
    - "清洗 RL 数学题时逐条检查三件事：答案是否唯一可验证、题目是否开放式、答案是否为闭式表达；缺一项就会产生噪声奖励或可猜奖励。"
    - "把选择题改写成开放式问答能回收大量题目，但改写后要重新确认答案唯一。"
  tags: [数学 RL, 数据清洗, 选择题改写]

