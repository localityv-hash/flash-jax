  summary: "Hugging Face 主导的 DeepSeek-R1 全开源复现：公开 R1 蒸馏数据集（Mixture-of-Thoughts 含 35 万条已验证轨迹），以及去污染、通过率过滤、沙箱代码奖励和 SFT/GRPO 脚本。"
  plain: "把 DeepSeek-R1“怎么造数据、怎么训”的每个环节都用开源工具重做一遍并公开，是一份可以照着跑的配方。"
  takeaways:
    - "自建蒸馏数据可以直接套它的流水线：多次采样 → Math-Verify 验证 → 8-gram 去污染与去重 → 按通过率筛 RL 提示。"
    - "Qwen 基座做 SFT 时 EOS 要与 chat template 一致（`<|im_end|>`）；拿 R1-Distill 做 GRPO 要改写其默认模板，它会丢弃思考内容并预填 `<think>`，干扰格式奖励。"
  builds_on: [deepseek-r1, numinamath, s1, math-verify]
  tags: [R1 复现, 蒸馏数据, 去污染, GRPO]

- id: kodcode
  title: "KodCode: A Diverse, Challenging, and Verifiable Synthetic Dataset for Coding"
  short: KodCode
  kind: dataset
  org: Microsoft GenAI · 华盛顿大学 · UT Austin
  authors: "Zhangchen Xu et al."
  date: 2025-03
  venue: ACL 2025
  arxiv: "2503.02951"
  repo: KodCode-AI/kodcode
  url: https://kodcode-ai.github.io/
  links:
    - { label: "KodCode-V1（RL）", url: "https://huggingface.co/datasets/KodCode/KodCode-V1" }
    - { label: "KodCode-V1-SFT-R1", url: "https://huggingface.co/datasets/KodCode/KodCode-V1-SFT-R1" }
  areas: [rl-llm, sft]
  facets: [data]
  tier: rec
  evidence: [adopted, open-source, ablation, community]
  evidence_note: "Kimi K2 技术报告把 KodCode 列为竞赛编程 RL 的开源题源之一，MiniCPM4 的代码数据也包含 KodCode；论文验证了自验证机制的有效性、做了污染分析与 SFT 对比实验，ACL 2025 录用，并获 ICML 2025 DataWorld 研讨会最佳论文。"
  summary: "全合成可验证代码数据：12 类来源合成题目并语义去重，GPT-4o 同写解答与单元测试、执行互验（难题最多重试 10 次），共 44.7 万组“题-解-测试”，另用 R1 按测试拒绝采样出 SFT 数据。"
  plain: "让模型自己出编程题、写答案、再写测试来检查答案；只有过了测试的题才留下，所以每道题都自带判卷器。"
  takeaways:
    - "合成可验证数据时别把一次没通过自检的题直接扔掉：给难题多次重试，用重试成功率当难度标签，否则数据会整体偏简单。"
    - "RL 用“题-解-测试”三元组，SFT 用多次采样后只保留过测试的回答；两份数据共用题目时，注意别让 RL 题提前出现在 SFT 里。"
  tags: [代码 RL, 单元测试, 合成数据, 拒绝采样]

