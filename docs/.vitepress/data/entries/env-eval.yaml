  evidence_note: "开源 8.1K 个任务环境、数据与模型；论文对比了基于 commit 与基于 PR 的数据构造，以及执行型、非执行型与混合验证器在推理时扩展下的效果。其环境随后被 DeepSWE 用于 RL 训练，仓库提供复现指南。"
  summary: "SWE-GEN 从 commit 而非人工 PR 出发，自动搭环境、生成测试并回译任务描述，得到 13 个仓库的 8.1K 个任务；混合执行型与非执行型验证器做推理时扩展，SWE-bench Verified 达 51%。"
  plain: "不再等别人写好 issue 和测试：直接从代码提交历史里“倒推”出题目和判卷标准，题量一下就上来了；挑答案时再请两位风格不同的阅卷老师一起把关。"
  takeaways:
    - "从 commit 回译任务描述、自动生成测试，可以摆脱对人工 PR 与 issue 的依赖，显著扩大 SWE 任务池。"
    - "推理时挑答案，跑测试的执行型验证和打分模型的非执行型验证互补，混合使用效果最好。"
  builds_on: [swe-gym]
  tags: [SWE, 环境合成, 混合验证器]

- id: swe-smith
  title: "SWE-smith: Scaling Data for Software Engineering Agents"
  short: SWE-smith
  kind: paper
  org: Stanford · Princeton
  authors: "John Yang et al."
  date: 2025-04
  venue: NeurIPS 2025 D&B（Spotlight）
  arxiv: "2504.21798"
  repo: SWE-bench/SWE-smith
  url: https://swesmith.com/
  areas: [agentic-rl]
  facets: [env, data]
  tier: rec
  evidence: [open-source, ablation]
  evidence_note: "开源 5 万余个任务实例、2.6 万条轨迹、250 多个仓库级 Docker 环境与 SWE-agent-LM-32B（SWE-bench Verified 40.2% pass@1）；README 显示已被 SkyRL 用于 GRPO 式训练，Qwen3-Coder-Next 技术报告也把它列为合成任务的基础之一。"
  summary: "反过来造任务：每个仓库只搭一个执行环境，再用 LLM 改写、AST 变换、回滚 PR 等方式注入 bug，保留能让现有单测失败的实例并生成 issue 描述，低成本合成 5 万级任务。"
  plain: "与其到处找真实 bug，不如在一个装好的仓库里“故意埋雷”：埋完看测试有没有报警，报警了就是一道合格的题。"
  takeaways:
    - "SWE 环境的主要成本在“每个任务一套环境”；改成“每个仓库一套环境、在里面批量造任务”，构建与存储成本大幅下降。"
    - "合成 bug 是否有效以“能让已有单测失败”为准，这一步必须在真实执行环境里验证。"
  builds_on: [swe-bench, swe-gym]
  tags: [SWE, bug 注入, 数据扩展]

- id: agentscaler
  title: "Towards General Agentic Intelligence via Environment Scaling"
  short: AgentScaler
  kind: paper
  org: 阿里巴巴通义实验室
  authors: "Runnan Fang et al."
  date: 2025-09
  arxiv: "2509.13311"
  links:
    - { label: 项目说明（Tongyi DeepResearch 仓库）, url: "https://github.com/Alibaba-NLP/DeepResearch/tree/main/Agent/AgentScaler" }
  areas: [agentic-rl]
  facets: [env, data]
  tier: rec
  evidence: [industrial, ablation]
  evidence_note: "Tongyi DeepResearch 技术报告写明，其通用函数调用数据正是用这套“环境扩展”方法合成（每个环境实例化为可读写数据库），并用于该开源模型的智能体中训练阶段；论文在 τ-bench、τ²-bench、ACEBench 上比较了两阶段训练与不同规模模型的效果。"
  summary: "收集约 3 万个 API，按参数相似度建工具图并用 Louvain 切成 1000 多个领域；每个领域落成“读写数据库 + Python 工具”的模拟环境，沿工具图采样任务，以数据库终态和调用序列校验轨迹。"
  plain: "把几万个 API 按“常一起用”分成上千个小世界，每个小世界是一个可读写的数据库：调工具就是改数据库，最后看数据库改得对不对，就知道事办没办成。"
  takeaways:
    - "工具使用环境最省事的可验证方式是“状态比对”：工具实现成对数据库的读写，任务成败看终态是否等于目标状态。"
    - "先在大量通用领域上训基础工具能力，再在目标领域专项训练，两阶段比一步混训更稳。"
  builds_on: [tau-bench]
