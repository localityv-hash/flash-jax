# On-Policy 蒸馏相关术语。维护者：opd。

- id: knowledge-distillation
  term: KD
  full: Knowledge Distillation
  zh: 知识蒸馏
  area: opd
  plain: "让小模型（学生）去模仿大模型（教师）的输出，把大模型的本事“压”进小模型里。"
  definition: "用教师模型的输出（整张概率分布、采样出的序列或打分）作为监督训练学生模型。经典做法是在固定数据上最小化教师分布到学生分布的前向 KL；按数据由谁生成可分为离线蒸馏与在线（on-policy）蒸馏。"
  see: [/topics/opd, /topics/opd#map]

- id: on-policy-distillation
  term: OPD
  full: On-Policy Distillation
  zh: 在线策略蒸馏
  area: opd
  plain: "学生自己写答案，教师逐字打分；学生专门在自己会犯的错上被纠正。"
  definition: "学生从自身策略采样回答，教师对回答的每个位置给出概率反馈，学生据此最小化两者在学生访问状态上的散度。最常见的实现把逐 token 反向 KL 的负值 log π_T(y_t) − log π_θ(y_t) 当作稠密奖励，用策略梯度更新。"
  see: [/topics/opd, /topics/opd#reverse-kl, /practice/opd]

- id: exposure-bias
  term: Exposure Bias
  zh: 暴露偏差
  area: opd
  plain: "训练时总在“标准答案”的前缀上学，推理时却要接着自己写的前缀往下写；一旦写偏，模型从没见过这种局面。"
  definition: "自回归模型训练时条件于真实或教师前缀、推理时条件于自己生成的前缀，二者分布不一致；早期的小错误会改变后续状态并不断累积。模仿学习理论中，纯行为克隆的累积误差可随序列长度二次增长。"
  see: [/topics/opd#exposure-bias]

- id: teacher-forcing
  term: Teacher Forcing
  zh: 教师强制
  area: opd
  plain: "训练时每一步都把正确答案的前文喂给模型，让它只预测下一个词。"
  definition: "序列模型的标准监督训练方式：第 t 步以真实（或教师给出的）前缀 y_<t 为条件，最大化下一个 token 的似然。高效且可并行，但训练状态来自数据而非模型自身，是暴露偏差的来源。"
  see: [/topics/opd#exposure-bias, /topics/sft#objective]

- id: gkd
  term: GKD
  full: Generalized Knowledge Distillation
  zh: 广义知识蒸馏
  area: opd
  plain: "一个旋钮调“用多少学生自己写的样本”，另一个旋钮调“用哪种距离去比较师生”。"
  definition: "Agarwal 等（ICLR 2024）提出的统一框架：目标为 (1−λ)·固定数据上的散度 + λ·学生样本上的散度，λ 为学生数据比例，散度可取前向 KL、反向 KL 或广义 JSD(β)；不对学生采样过程求导。λ=1 即在线蒸馏。"
  see: [/topics/opd#gkd]

- id: jsd
  term: JSD(β)
  full: Generalized Jensen–Shannon Divergence
  zh: 广义 JS 散度
  area: opd
  plain: "介于前向 KL 和反向 KL 之间的一把“滑尺”，而且永远不会算出无穷大。"
  definition: "JSD(β)(P‖Q) = β·KL(P‖M) + (1−β)·KL(Q‖M)，其中 M = βP + (1−β)Q。有界；β→0 时（除以 β 后）趋于前向 KL(P‖Q)，β→1 时梯度行为接近反向 KL。GKD 与 TRL 的蒸馏训练器用 β 选择散度。"
  see: [/topics/opd#gkd]

- id: sequence-kd
  term: Seq-KD
  full: Sequence-Level Knowledge Distillation
  zh: 序列级知识蒸馏
  area: opd
  plain: "让教师先把答案写出来，学生再照着这些答案做 SFT。"
  definition: "Kim & Rush（2016）提出：用教师生成的序列作为训练目标做最大似然，等价于在教师样本上最小化前向 KL。实现简单、可离线批量生成，但学生只在教师访问过的状态上学习。"
  see: [/topics/opd#reverse-kl, /topics/opd#lineage]

- id: dense-reward
  term: Dense Reward
  zh: 稠密奖励
  area: opd
  plain: "不是等整道题做完才给一个对错，而是每写一个字都给一个分数。"
  definition: "在轨迹的每一步（每个 token）都给出的学习信号，与只在结尾给出的序列级奖励相对。OPD 的逐 token 奖励 r_t = log π_T(y_t) − log π_θ(y_t) 是典型的稠密奖励；过程奖励模型是另一类。"
  see: [/topics/opd#compute]

- id: self-distillation
  term: Self-Distillation
  zh: 自蒸馏
  area: opd
  plain: "不请更大的老师，让“多知道一点信息的自己”当老师，比如看过参考答案或判卷意见的自己。"
  definition: "教师与学生共享（或源自）同一组参数，教师额外获得特权上下文（参考解、示范、环境反馈等），在学生自己的采样上逐 token 蒸馏回不含特权信息的学生。代表工作有 OPSD、SDFT、SDPO。"
  see: [/topics/opd#self-distill]

- id: mopd
  term: MOPD
  full: Multi-Teacher On-Policy Distillation
  zh: 多教师在线蒸馏
  area: opd
  plain: "每个科目请一位最强的老师，学生自己做各科题，由对应科目的老师逐字批改。"
  definition: "先分领域训练若干专家（通常经 RL），再让一个统一学生在各领域提示上自行采样，按领域路由到对应教师计算逐 token 反向 KL 信号并合并训练。MiMo-V2-Flash、DeepSeek-V4、Nemotron 3 Ultra 等用它替代参数合并或混合 RL。"
  see: [/topics/opd#industrial]

- id: dagger
  term: DAgger
  full: Dataset Aggregation
  zh: 数据集聚合
  area: opd
  plain: "让新手自己开车，教练把新手实际开到的每个路口该怎么走记下来，再拿这些记录训练新手。"
  definition: "Ross、Gordon、Bagnell（2011）提出的交互式模仿学习算法：用当前学习者的策略收集状态，请专家在这些状态上标注动作，聚合数据后重新训练；在一定可恢复性假设下把行为克隆随时长二次增长的误差降为线性。OPD 可视为以教师为专家的 DAgger。"
  see: [/topics/opd#exposure-bias]
