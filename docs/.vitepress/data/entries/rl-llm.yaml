  takeaways:
    - "没有标准答案的任务，先把“好”拆成可逐条核对的量表条目，再让裁判模型按条目打分，比整体打分更稳、更难被刷分。"
  tags: [rubric, 不可验证任务, LLM 裁判]

- id: reward-overoptimization
  title: "Scaling Laws for Reward Model Overoptimization"
  short: RM 过优化扩展律
  kind: paper
  org: OpenAI
  authors: "Leo Gao et al."
  date: 2022-10
  venue: ICML 2023
  arxiv: "2210.10760"
  areas: [rl-llm]
  facets: [theory, eval]
  tier: rec
  evidence: [ablation, community]
  evidence_note: "OpenAI 用“金标准 RM 给代理 RM 打标签”的合成设定做系统扩展实验；DeepSeek-R1 解释为何不用神经 PRM 时即引用此文，是讨论奖励作弊的标准参考。"
  summary: "用金标准奖励模型标注数据来训练不同规模的代理 RM，测量优化代理 RM（best-of-n 与 RL）时真实奖励随 KL 距离的变化：先升后降，拐点与幅度随代理 RM 规模和数据量平滑变化。"
  plain: "照着“打分员”使劲优化，真实质量一开始会涨，走太远就开始跌；打分员越大、数据越多，能安全走的距离越远。"
  takeaways:
    - "用学习到的 RM 做 RL 时，把与参考策略的 KL 当作预算来监控，并用留出的更强评估（人工或更大的 RM）确定早停点。"
