  summary: "指出 RLHF 模拟快、转移确定、奖励只在轨迹末端，于是改用 REINFORCE，以贪心解码回答的奖励作基线降方差，去掉价值模型，比 PPO 少 4 个以上超参。"
  plain: "同一道题让模型再“认真答一遍”（贪心解码）当参照分：采样答案比它好就加强，比它差就削弱，不用训练估分网络。"
  takeaways:
    - "奖励只在序列末端给出时，价值网络的收益有限；先用 ReMax、RLOO 这类无 critic 方法建立基线，能省下大块显存。"
  builds_on: [ppo]
  tags: [REINFORCE, 基线, 无 critic]

- id: rloo
  title: "Back to Basics: Revisiting REINFORCE Style Optimization for Learning from Human Feedback in LLMs"
  short: RLOO
  kind: paper
  org: Cohere For AI · Cohere
  authors: "Arash Ahmadian et al."
  date: 2024-02
  venue: ACL 2024
  arxiv: "2402.14740"
  areas: [rl-llm]
  facets: [algorithm]
  tier: rec
  evidence: [ablation, community]
  evidence_note: "在多组 RLHF 设置下与 PPO、DPO、RAFT 做受控对比；Kimi k1.5 论证去掉价值网络时引用了它，TRL、OpenRLHF、verl 都提供 RLOO，PRIME 也用它估计优势。"
  summary: '论证 PPO 为经典 RL 设计的许多组件在 RLHF 中并不必要：把整段回答当作一个动作，用同题其余 $k-1$ 个样本的平均奖励作留一基线（RLOO），效果优于 PPO、DPO 和 RAFT，且不需要价值网络。'
  plain: '同一道题做 $k$ 遍，每个答案都拿“其他几遍的平均分”当及格线，既不用估分网络，又不会自己跟自己比。'
  takeaways:
    - "RLHF 中奖励只在结尾出现时，把整段回答当成单个动作往往就够了；先上 RLOO，再考虑 PPO 的复杂度是否值得。"
  builds_on: [ppo]
  tags: [REINFORCE, 留一基线, 无 critic]

