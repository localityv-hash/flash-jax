  summary: "把 RL 环境做成可安装的 Python 模块：数据集、交互逻辑与 Rubric（加权奖励函数）三件套，同一环境可直接用于评测、合成数据与训练，并可发布到 Environments Hub 共享。"
  plain: "给练习场定了统一的“插头”：谁写的练习场都能插进同一套评测和训练流程，写好的还能发到 Hub 上给别人直接用。"
