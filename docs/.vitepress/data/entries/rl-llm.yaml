  short: InstructGPT
  kind: paper
  org: OpenAI
  authors: "Long Ouyang et al."
  date: 2022-03
  venue: NeurIPS 2022
  arxiv: "2203.02155"
  repo: openai/following-instructions-human-feedback
  areas: [rl-llm]
  facets: [algorithm, data]
  tier: must
  evidence: [industrial, adopted, ablation, community]
  evidence_note: "OpenAI 以此流程训练 InstructGPT，“SFT → 奖励模型 → PPO”三段式随后成为 Llama 2 等工业后训练的标准流程；论文含大规模人工评测与 PPO / PPO-ptx 对照。仓库只含模型卡、样例与标注说明。"
  summary: "确立 RLHF 三段式：示范数据 SFT、用排序比较训练奖励模型、PPO 带逐 token KL 惩罚优化并混入预训练梯度（PPO-ptx）；1.3B 模型的输出被评为优于 175B 的 GPT-3。"
  plain: "先教模型照着写，再请人给几个回答排座次、训练一个“打分员”，最后让模型为了高分反复练，同时拴一根 KL 绳子别跑太远。"
  takeaways:
    - "奖励模型只是人类偏好的代理：RL 阶段必须用 KL 约束或早停控制与参考策略的距离，并定期用人工评测校准。"
    - "RL 后通用能力回退时，可仿照 PPO-ptx 在目标里混入少量预训练或高质量 SFT 数据的似然项。"
  builds_on: [ppo]
  tags: [RLHF, 奖励模型, PPO]

