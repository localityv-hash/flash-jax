- id: kl-approx
  title: "Approximating KL Divergence"
  short: KL 近似（k1/k2/k3）
  kind: blog
  org: John Schulman（个人博客）
  authors: "John Schulman"
  date: 2020-03
  url: http://joschu.net/blog/kl-approx.html
  areas: [rl-llm]
  facets: [theory, algorithm]
  tier: rec
  evidence: [adopted, community]
  evidence_note: "DeepSeekMath / R1 的 GRPO 目标中的 KL 项正是文中的 k3 估计器，verl 等框架的 KL 实现注释也直接引用本文；后续关于 KL 梯度估计偏差的讨论大多以它为起点。"
  summary: '比较三种用样本估计 $\KL(q\,\|\,p)$ 的方法（$x\sim q$，$r=p(x)/q(x)$）：$k_1=-\log r$ 无偏但方差大、可为负；$k_2=\tfrac12(\log r)^2$ 低方差但有偏；$k_3=(r-1)-\log r$ 无偏、非负且方差低，成为 LLM RL 的事实标准。'
  plain: "KL 没法精确算，只能拿采样到的回答去估；作者比较了三种估法，第三种不会估出负数、波动也小，所以大家都用它。"
  takeaways:
    - "用 k3 时分清它是加在奖励里还是作为损失求导：直接对 k3 求梯度并不等于反向 KL 的梯度，离策略时还需用重要性权重修正（参见 DeepSeek-V3.2 的无偏 KL）。"
  tags: [KL 估计, k3, 方差]

