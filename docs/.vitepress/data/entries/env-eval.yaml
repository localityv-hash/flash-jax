  summary: "为数独、24 点、密码、箭头迷宫等 35 类逻辑任务各写一个难度可控的生成器和规则验证器，批量合成可验证数据；RL 后逻辑推理显著提升，与数学、代码数据混合训练还能相互促进。"
  plain: "给每种逻辑谜题造一台出题机和一个判卷器，想要多难就调多难；练逻辑题练出来的本事还能迁移到数学和写代码上。"
  takeaways:
    - "合成题的难度上下界用模型自己的通过率标定：强模型 pass@10 都为 0 的太难、基座轻松做对的太易，两头都没有学习信号。"
    - "把逻辑谜题和数学、代码数据混在一起训练，而不是单独训练，泛化更好。"
