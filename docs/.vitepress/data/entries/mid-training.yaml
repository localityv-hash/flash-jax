  summary: "三段式 base 训练：Dolma 3 预训练、Dolmino 中训练（100B token，含数学、代码、QA、指令与思维链，全部去污染）、Longmino 长上下文（YaRN 扩到 64K）；32B 对两次中训练结果做模型汤。"
  plain: "像公开了完整菜谱和每一步用料清单的厨房：什么时候放什么、放多少、为什么，都能对着账本复现。"
  takeaways:
    - "搭中训练配比可以 Dolmino 的类别比例为起点（网页、代码、数学各约两成，再加 QA、指令与思维链），再用微退火逐项调。"
    - "中训练数据要做 n-gram 级去污染：数学与 QA 合成数据最容易混入评测题。"
