# ───────────────────────── 评测基准：代码与 SWE ─────────────────────────

- id: humaneval-codex
  title: "Evaluating Large Language Models Trained on Code"
  short: Codex / HumanEval
  kind: paper
  org: OpenAI
  authors: "Mark Chen et al."
  date: 2021-07
  arxiv: "2107.03374"
  repo: openai/human-eval
  areas: [rl-llm]
  facets: [eval]
  tier: must
  evidence: [industrial, adopted, open-source, community]
  evidence_note: "OpenAI Codex 的技术论文。HumanEval 与文中推导的 pass@k 无偏估计量（参考实现为 human-eval 仓库里的 estimate_pass_at_k）被几乎所有代码与推理评测沿用；引用量极高。"
  summary: "发布 HumanEval（164 道手写编程题，单元测试判分），并给出 pass@k 的无偏估计：每题采样 n≥k 个、数出 c 个正确，用 1−C(n−c,k)/C(n,k) 估计 k 次机会至少对一次的概率。"
  plain: "让模型对同一道题写很多份代码，数数有几份能过测试，再用一个组合公式换算成“给它 k 次机会至少对一次”的概率。"
  takeaways:
    - "算 pass@k 时让采样数 n 明显大于 k，并用无偏估计量；不要用 1−(1−c/n)^k，它系统性偏低。"
  tags: [pass@k, 代码评测, HumanEval]

