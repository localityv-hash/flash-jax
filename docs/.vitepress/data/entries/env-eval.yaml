  areas: [agentic-rl]
  facets: [eval, env]
  tier: rec
  evidence: [adopted, open-source]
  evidence_note: "Kimi K2（66.1）、Seed2.0 等技术报告以它为主力工具使用基准；仓库 2026 年升级为 τ³-bench，加入知识检索与全双工语音，并基于 SABER 的分析修正 75 处以上任务错误，同时声明 1.0.1 前后的成绩不可直接比较。"
  summary: "在 τ-bench 上引入“双控制”电信领域：用户也持有工具、会改变环境状态，智能体必须指导用户操作；配合组合式任务生成与受工具约束的用户模拟器，把推理失误与沟通协作失误分开诊断。"
  plain: "上一代只有客服能操作系统；这一代顾客手里也有手机要自己点，客服得一步步指导顾客操作，考的是“能不能带着人把事办成”。"
  takeaways:
    - "引用 τ 系列成绩时写明版本与任务划分：任务修订前后的成绩不能直接比较。"
  builds_on: [tau-bench]
  tags: [双控制, 用户模拟, 工具使用]

- id: webarena
  title: "WebArena: A Realistic Web Environment for Building Autonomous Agents"
  short: WebArena
  kind: benchmark
  org: CMU
  authors: "Shuyan Zhou et al."
  date: 2023-07
  arxiv: "2307.13854"
  repo: web-arena-x/webarena
  areas: [agentic-rl]
  facets: [eval, env]
  tier: rec
  evidence: [adopted, open-source, community]
  evidence_note: "自托管网站环境被 OpenHands 等框架接入，Kimi K2.5 等仍在报告；基于最终状态的“功能正确性”判分被后续网页与电脑操作基准广泛沿用。"
  summary: "用 Docker 自托管电商、论坛、GitLab、内容管理与地图等真实网站，812 个长程网页任务以程序化检查最终页面与后台状态判分，让网页智能体评测可复现、可在本地大规模运行。"
  plain: "把几个真实网站“复制”到本地，让模型在里面下单、发帖、提交代码，最后检查网站里的数据有没有按要求变化。"
  takeaways:
    - "网页环境要能一键重置：自托管 + 快照是可复现评测和 RL 训练的前提。"
  tags: [网页智能体, 自托管环境]

- id: osworld
  title: "OSWorld: Benchmarking Multimodal Agents for Open-Ended Tasks in Real Computer Environments"
  short: OSWorld
  kind: benchmark
  org: HKU · Salesforce Research · CMU 等
  authors: "Tianbao Xie et al."
  date: 2024-04
  arxiv: "2404.07972"
  repo: xlang-ai/OSWorld
  url: https://os-world.github.io/
  links:
    - { label: OSWorld-Verified 说明, url: "https://xlang.ai/blog/osworld-verified" }
  areas: [agentic-rl]
  facets: [eval, env]
  tier: must
  evidence: [adopted, open-source, community]
  evidence_note: "电脑操作方向最常被引用的基准，Anthropic、OpenAI 的电脑操作模型以及 UI-TARS-2、Kimi K2.5（OSWorld-Verified 63.3%）等都报告其成绩；2025-07-28 发布 OSWorld-Verified，修复社区反馈的任务问题并支持 AWS 并行，官方要求新旧版本成绩分开比较。"
  summary: "在真实操作系统虚拟机里评测多模态智能体：369 个跨应用任务，每个任务配有初始状态配置和基于执行结果的检查脚本；发布时人类约 72%，最好的模型约 12%。"
  plain: "直接给模型一台虚拟电脑，让它看屏幕、点鼠标、敲键盘完成真实工作（改表格、装软件），做完由脚本检查结果。"
  takeaways:
    - "比较电脑操作成绩时区分原版与 OSWorld-Verified，并写明步数上限和观测设置（纯截图还是加无障碍树）。"
  builds_on: [webarena]
  tags: [电脑操作, GUI 智能体, 多模态]

- id: browsecomp
  title: "BrowseComp: A Simple Yet Challenging Benchmark for Browsing Agents"
  short: BrowseComp
  kind: benchmark
  org: OpenAI
  authors: "Jason Wei et al."
  date: 2025-04
  arxiv: "2504.12516"
  repo: openai/simple-evals
  url: https://openai.com/index/browsecomp
  links:
    - { label: BrowseComp-Plus（固定语料版）, url: "https://arxiv.org/abs/2508.06600" }
    - { label: Anthropic：评测中的“识破考题”案例, url: "https://www.anthropic.com/engineering/eval-awareness-browsecomp" }
  areas: [agentic-rl]
  facets: [eval]
  tier: must
  evidence: [industrial, adopted, open-source]
  evidence_note: "OpenAI 用于评测 Deep Research 等浏览智能体，参考实现开源在 simple-evals；Tongyi DeepResearch、Kimi K2.5/K3、Seed2.0 等都以它为深度研究主指标。Anthropic 曾记录模型在评测中推断出题目来源、找到加密数据集的镜像并自行解密答案的案例，说明开放网络评测需要主动防护。"
  summary: "1,266 道“难找易验”的问题：答案是简短事实，便于自动核对，但需要在开放网络上长时间、多跳地搜索才能找到，专门衡量浏览智能体的检索坚持度与搜索策略。"
  plain: "像超难版“寻宝题”：答案一句话就能核对，但要翻遍互联网才找得到，考的是模型会不会锲而不舍、换着法子搜。"
  takeaways:
    - "评测深度研究智能体时，写明搜索后端、可访问范围与预算；需要可复现对比时，改用固定语料的 BrowseComp-Plus。"
  tags: [深度研究, 浏览智能体, 难找易验]

- id: gaia
  title: "GAIA: A Benchmark for General AI Assistants"
  short: GAIA
  kind: benchmark
  org: Meta · Hugging Face · AutoGPT
  authors: "Grégoire Mialon et al."
  date: 2023-11
  arxiv: "2311.12983"
  areas: [agentic-rl]
  facets: [eval]
  tier: rec
  evidence: [adopted, community]
  evidence_note: "通用助手评测的早期标杆，Tongyi DeepResearch 等深度研究模型仍在报告；Meta 2025 年推出动态环境版后继 Gaia2。验证集答案公开，存在针对性优化与泄漏风险。"
  summary: "466 道需要浏览、多模态理解与工具使用的真实助手问题，按所需步骤与工具数分三级，答案简短可自动核对；发布时人类正确率约 92%，配插件的 GPT-4 约 15%。"
  plain: "对人来说不难、但要动手查资料和用工具的日常问题，专门检验 AI 助手“会不会办事”，而不是“会不会考试”。"
  takeaways:
    - "公开验证集只适合调试；对外报告成绩优先用答案不公开的测试集或其动态后继 Gaia2。"
  tags: [通用助手, 工具使用]

- id: are-gaia2
  title: "ARE: Scaling Up Agent Environments and Evaluations"
  short: ARE / Gaia2
  kind: paper
  org: Meta
  date: 2025-09
  arxiv: "2509.17158"
  repo: facebookresearch/meta-agents-research-environments
  links:
    - { label: Gaia2 介绍（Hugging Face 博客）, url: "https://huggingface.co/blog/gaia2" }
  areas: [agentic-rl]
  facets: [env, eval]
  tier: rec
  evidence: [industrial, open-source]
  evidence_note: "Meta 发布的智能体研究平台，开源环境框架、Gaia2 基准、Hugging Face 上的演示与排行榜，并在 2026 年扩展出多语言版 Omnilingual-Gaia2。"
  summary: "ARE 把环境建模为随时间演化的“应用 + 事件 + 场景”，世界会在智能体行动时异步变化；其上的 Gaia2 含 800 个跨 10 个“宇宙”的动态场景，考察应变、时间约束与多智能体协作。"
  plain: "以前的考题是静止的，Gaia2 的世界会自己动：你还在处理邮件，新消息和日程变动就来了，智能体得边干边应变。"
  takeaways:
    - "评测助手类智能体时加入异步事件与时间约束，才能暴露“只会按部就班执行”的短板。"
  builds_on: [gaia]
  tags: [动态环境, 异步事件, 通用助手]

- id: gdpval
  title: "GDPval: Evaluating AI Model Performance on Real-World Economically Valuable Tasks"
  short: GDPval
  kind: benchmark
  org: OpenAI
  authors: "Tejal Patwardhan et al."
  date: 2025-09
  arxiv: "2510.04374"
  areas: [agentic-rl]
  facets: [eval]
  tier: rec
  evidence: [industrial, adopted, open-source]
  evidence_note: "OpenAI 发布，开源 220 题的 gold 子集并提供自动判分服务；Kimi K2.5、Kimi K3、Seed2.0 等 2026 年旗舰报告都把它（或第三方的自动判分变体）列入评测。它直接回应“基准分数高、现实效用低”，但以专家成对盲评为主，成本高且带主观性。"
  summary: "从美国 GDP 贡献最大的 9 个行业选 44 个职业，由行业专家编写 1,320 个真实工作任务（附参考文件，产出文档、表格、幻灯片等），由专家对模型与人类的产出做盲评比较。"
  plain: "不考题，直接派活：让模型做律师、护士、工程师等职业里真正要交付的成果，再请行家盲评它和人类专家谁做得好。"
  takeaways:
    - "当基准分数与业务价值脱节时，考虑“真实交付物 + 专家盲评”的评测，并接受它更贵、更慢。"
  tags: [经济价值, 专家评审, 真实任务]

# ───────────────────────── 评测基准：知识与推理 ─────────────────────────

- id: gpqa
  title: "GPQA: A Graduate-Level Google-Proof Q&A Benchmark"
  short: GPQA
  kind: benchmark
  org: NYU · Cohere · Anthropic
  authors: "David Rein et al."
  date: 2023-11
  arxiv: "2311.12022"
  repo: idavidrein/gpqa
  areas: [rl-llm]
  facets: [eval]
  tier: rec
  evidence: [adopted, open-source, community]
  evidence_note: "其 Diamond 子集是 2024–2026 年几乎所有推理模型报告的必备项（如 Kimi K2 报告 75.1）；数据带 canary 字符串并加密分发以降低泄漏。头部模型成绩已接近饱和，区分度明显下降。"
  summary: "448 道由生物、物理、化学博士级专家编写的四选一难题，设计成“搜不到答案”：领域专家正确率约 65%，允许上网半小时以上的高水平非专家仅约 34%；最常用的是 198 题的 Diamond 子集。"
  plain: "请博士出题，专门出那种“就算给你上网查半小时也做不出来”的题，考模型是不是真懂专业知识。"
  takeaways:
    - "GPQA Diamond 只有 198 题，单次运行的波动可达数个百分点；比较时用多次采样平均（avg@k）并给出置信区间。"
  tags: [科学问答, 专家级, 饱和]

- id: hle
  title: "Humanity's Last Exam"
  short: HLE
  kind: benchmark
  org: Center for AI Safety · Scale AI
  date: 2025-01
  venue: Nature（2026）
  arxiv: "2501.14249"
  repo: centerforaisafety/hle
  url: https://lastexam.ai
  links:
    - { label: FutureHouse 对化学/生物题的核查, url: "https://www.futurehouse.org/research-announcements/hle-exam" }
  areas: [rl-llm]
  facets: [eval]
  tier: rec
  evidence: [adopted, open-source, community]
  evidence_note: "发布后迅速成为旗舰模型与深度研究智能体的标配指标（Tongyi DeepResearch、Kimi K2.5/K3、Seed2.0 等均报告），2026 年正式发表于 Nature。FutureHouse 的核查认为化学、生物纯文本题中约 29% 的参考答案与文献相悖，使用时需留意标签噪声。"
  summary: "全球学科专家编写的 2,500 道前沿闭卷题（数学、人文、自然科学等，含多模态），入选题须先难倒当时的前沿模型；答案为选择或短答，由评审模型判分，并同时报告校准误差。"
  plain: "请各领域专家专门出“AI 答不上来”的难题攒成终极试卷；不过以“难倒模型”为筛选条件，也让一部分标准答案本身有争议。"
  takeaways:
    - "以“难倒模型”为入选条件的基准，标签错误率天然偏高：比较小幅提升要谨慎，最好人工复核争议题。"
  tags: [前沿知识, 闭卷, 标签噪声]

# ───────────────────────── 评测方法论 ─────────────────────────

- id: sober-look
  title: "A Sober Look at Progress in Language Model Reasoning: Pitfalls and Paths to Reproducibility"
  short: Sober Look
  kind: paper
  org: Tübingen AI Center · University of Cambridge
  authors: "Andreas Hochlehnert et al."
  date: 2025-04
  venue: COLM 2025
  arxiv: "2504.07086"
  repo: bethgelab/sober-reasoning
  url: https://bethgelab.github.io/sober-reasoning/
  areas: [rl-llm]
  facets: [eval]
  tier: rec
  evidence: [ablation, open-source]
  evidence_note: "逐一控制随机种子、采样参数、提示模板、硬件与推理框架等变量；公开代码、提示和全部模型输出，并维护按统一协议重测的排行榜（AIME/AMC 各 10 个种子，其余基准 3 个种子，报告均值±标准差）。"
  summary: "发现数学推理基准对解码参数、随机种子、提示格式乃至硬件与软件版本高度敏感，不少提升来自不透明的比较；按统一协议重测后，多数 RL 方法的收益远小于原文所报，SFT 方法的泛化更稳定。"
  plain: "同一个模型换个随机种子、换台机器，AIME 分数就能差好几分；很多“提升”其实在噪声范围内。作者把大家拉回同一起跑线重测了一遍。"
  takeaways:
    - "在 AIME 这类 30 题的小基准上至少跑 10 个种子，报告均值±标准差；否则 3–5 个点的提升没有意义。"
    - "对比实验要固定并公开温度、top-p、最大生成长度、提示模板与推理框架版本。"
  tags: [可复现性, 方差, 数学推理]

- id: error-bars
  title: "Adding Error Bars to Evals: A Statistical Approach to Language Model Evaluations"
  short: 评测误差棒
  kind: paper
  org: Anthropic
  authors: "Evan Miller"
  date: 2024-11
  arxiv: "2411.00640"
  areas: [rl-llm]
  facets: [eval, theory]
  tier: ref
  evidence: [community]
  evidence_note: "Anthropic 研究员的单作者方法论文，把基准分数当作从“题目总体”抽样得到的统计量，给出标准误、聚类标准误、配对差与功效分析的可直接套用的公式，在评测与可复现性讨论中被广泛引用。"
  summary: "把评测当作抽样实验：用中心极限定理给基准均分算标准误；题目成组出现时用聚类标准误；对同一题多次采样以压低题内方差；比较两个模型时用逐题配对差；事先做功效分析确定需要多少题。"
  plain: "考试分数本身有误差：题目是“抽”出来的，模型答题也有随机性。这篇文章教你给分数加误差棒，并判断两个模型的差距是不是真的。"
  takeaways:
    - "比较两个模型时用同一批题的逐题差值算标准误（配对检验），通常比各算各的误差棒小得多，能检出更小的真实差距。"
    - "题内随机性可以靠多次采样压下去，题目抽样带来的方差只能靠更多的题。"
  tags: [误差棒, 标准误, 统计检验]

- id: mt-bench
  title: "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena"
  short: LLM-as-a-Judge
  kind: paper
  org: LMSYS · UC Berkeley 等
  authors: "Lianmin Zheng et al."
  date: 2023-06
  arxiv: "2306.05685"
  repo: lm-sys/FastChat
  areas: [rl-llm]
  facets: [eval]
  tier: rec
  evidence: [adopted, open-source, community]
  evidence_note: "LLM-as-a-judge 的奠基性论文，MT-Bench 与其判分提示被大量后续评测沿用，代码开源在 FastChat；引用量极高。文中系统记录的位置偏差、冗长偏差与自我偏好，至今仍是设计评审模型时的检查清单。"
  summary: "系统研究用强模型当裁判评估开放式回答：GPT-4 与人类偏好的一致率超过 80%，与人类之间相当；同时揭示位置偏差、冗长偏差、自我偏好与判数学题能力有限，并给出交换顺序等缓解办法。"
  plain: "请最强的模型当阅卷老师，大体靠谱，但它有偏心：排在前面的答案、写得长的答案、自己写的答案，都容易多给分。"
  takeaways:
    - "用 LLM 裁判做成对比较时，交换两个答案的顺序各判一次，结论不一致就记为平局。"
  tags: [LLM-as-a-judge, 偏差, MT-Bench]

- id: hal-leaderboard
  title: "Holistic Agent Leaderboard: The Missing Infrastructure for AI Agent Evaluation"
  short: HAL
  kind: paper
  org: Princeton
  authors: "Sayash Kapoor et al."
  date: 2025-10
  arxiv: "2510.11977"
  repo: princeton-pli/hal-harness
  url: https://hal.cs.princeton.edu/
  links:
    - { label: 前作 AI Agents That Matter, url: "https://arxiv.org/abs/2407.01502" }
  areas: [agentic-rl]
  facets: [eval, infra]
  tier: rec
  evidence: [open-source, ablation]
  evidence_note: "开源统一评测框架 hal-harness；用同一套 harness 在 9 个基准、9 个模型上跑了 2 万余次标准化 rollout，同时记录准确率与成本；延续前作 AI Agents That Matter 对“成本受控评测”和留出集的主张。"
  summary: "为智能体评测提供统一的 harness 与排行榜：不同模型在各基准上用同样的运行与计费方式评测，报告准确率—成本的帕累托前沿，并用大规模日志分析揭示排行榜成绩中常被忽略的不可靠因素。"
  plain: "各家智能体成绩往往是在不同“考场规则”下测的。HAL 统一了考场：同样的工具、同样的预算，还把花了多少钱一起写进成绩单。"
  takeaways:
    - "报告智能体成绩时同时给出成本（token 或美元）与运行次数，用帕累托前沿而不是单一准确率比较方案。"
  tags: [智能体评测, 成本, 标准化 harness]

- id: metr-time-horizon
  title: "Measuring AI Ability to Complete Long Tasks"
  short: METR 时间视界
  kind: paper
  org: METR
  authors: "Thomas Kwa et al."
  date: 2025-03
  arxiv: "2503.14499"
  repo: METR/eval-analysis-public
  url: https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/
  areas: [agentic-rl]
  facets: [eval]
  tier: rec
  evidence: [ablation, open-source]
  evidence_note: "分析代码与运行数据开源（含 v1.0 与覆盖到 2026 年模型的 v1.1 两版报告）；以人类专家完成时间标定的软件任务集（HCAST、RE-Bench、SWAA）为基础，用 bootstrap 给出置信区间，并检验了任务子集与拟合方式的影响。“时间视界”已成为讨论智能体进展时最常被引用的度量之一。"
  summary: "用人类专家完成任务所需的时间刻画难度：为每个模型拟合“成功率—对数任务时长”的逻辑回归，取成功率 50% 处的任务时长作为时间视界；2019–2025 年前沿模型的时间视界约每 7 个月翻一番。"
  plain: "不问模型考了多少分，而问它能独立干完“人类要干多久”的活：从几秒钟的小事到几小时的项目，这个时长大约每 7 个月翻一倍。"
  takeaways:
    - "把智能体进展换算成“能完成多长的人类任务”，比单一基准分数更便于跨基准比较和看趋势。"
    - "它是 50% 成功率下的时长；要求高可靠性（如 80%）时，对应的时长要短得多。"
  tags: [时间视界, 智能体评测, 趋势]
