  summary: "为每道题生成实例级评分量表，把逐条检查的结果聚合成奖励做在线 RL；最佳变体比 Likert 打分的 LLM 裁判在 HealthBench 上最高相对提升 31%，GPQA-Diamond 上提升 7%。"
