  takeaways:
    - "环境本来就返回报错、测试日志等文字反馈时，别只用 0/1 奖励：把反馈喂给自教师，得到稠密信号。"
    - "只有标量奖励时，也可以拿同组成功样本当“反馈”，给失败样本提供逐 token 监督。"
  builds_on: [tm-opd]
  tags: [自蒸馏, RLVR, 富反馈]
