- id: prime-rl
  title: "prime-rl: Async RL Training at Scale"
  short: prime-rl
  kind: project
  org: Prime Intellect
  date: 2025-05
  repo: PrimeIntellect-ai/prime-rl
  links:
    - { label: INTELLECT-2 技术报告, url: https://arxiv.org/abs/2505.07291 }
  areas: [rl-llm, agentic-rl]
  facets: [infra, env]
  tier: rec
  evidence: [industrial, open-source, community]
  evidence_note: "Prime Intellect 用它训练 INTELLECT-2（全球分布式异步 RL，技术报告 arXiv 2505.07291）与 INTELLECT-3.x（仓库附 INTELLECT-3.1 复现配置）；默认一步重叠的异步流水，FSDP2 训练 + vLLM 推理，与 verifiers 环境库和 Environments Hub 原生集成，内置 router replay 与采样掩码回放。"
  summary: "推理（vLLM）、编排器（管理环境与多轮 rollout 的 CPU 进程）、训练器（FSDP2）三进程解耦；默认训练第 n 步时推理已在用上一版策略生成第 n+1 步数据，NCCL 广播权重，面向千卡与 1T 级 MoE。"
  plain: "一边改卷一边出下一批题，两边永远差一步，谁也不用等谁；环境跑在单独的 CPU 编排器里，GPU 只管算。"
  takeaways:
    - "想要“默认异步、改动最小”的方案可以参考它的一步重叠设计：训练与推理的单步耗时接近时几乎没有空转。"
