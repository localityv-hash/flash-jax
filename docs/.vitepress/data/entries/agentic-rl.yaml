  summary: "完全靠端到端 RL 训练的深度研究智能体，HLE 从 8.6% 升到 26.9%：REINFORCE、严格 on-policy、有选择地丢弃负样本、对正确轨迹做 γ 衰减奖励，并配合上下文管理与轮次级 partial rollout。"
  plain: "不写流程、不靠示范，直接让模型在真实搜索里反复试错；答对得分，而且越快答对分越高。"
  takeaways:
