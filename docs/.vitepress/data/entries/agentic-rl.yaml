  summary: "基于 Qwen3-30B-A3B-Base，做两阶段智能体持续预训练（32K→128K）、SFT 与严格 on-policy 的 RL（token 级 GRPO 变体、留一基线、筛除部分负样本），先在离线维基模拟环境验证、再迁到真实网页。"
  plain: "阿里把训练“研究员型”智能体的整条流水线公开了：先大量读智能体数据，再模仿，最后在模拟网和真网上反复练。"
  takeaways:
    - "先在廉价、确定的模拟环境（离线 Wikipedia + 本地 RAG）里调通算法，再迁到真实环境做最终训练。"
    - "给真实工具加一层统一沙箱：限流、缓存、超时重试、故障切换，把不稳定的外部 API 变成确定性接口。"
    - "报告的核心结论：智能体 RL 的成败更取决于数据质量与环境稳定性，而非具体算法。"
