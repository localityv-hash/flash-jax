  evidence_note: "DeepSeek 在 DeepSeekMath、V3、R1、V3.2 中持续使用；Qwen3、MiMo、Magistral 等工业报告以它为起点修改，DAPO、Dr. GRPO、GSPO 都是对它的修正；权重与评测代码开源。"
  summary: "构建 120B token 的数学语料继续预训练出 DeepSeekMath 7B，并提出 GRPO：同一题采样一组回答，以组内奖励的均值与标准差归一化作优势，去掉价值网络，显著降低 PPO 的显存开销。"
  plain: "同一道题让模型做一组，拿组内平均分当及格线、组内分差当尺度来打分，不再需要另一个和模型一样大的“估分老师”。"
  takeaways:
    - "奖励稀疏、只看最终答案时，GRPO 是最省事的起点；但它的长度归一化与标准差归一化会引入偏置，见 Dr. GRPO。"
    - "组内全对或全错时优势为 0、没有梯度；这类题占比高时要做难度筛选或动态采样。"
