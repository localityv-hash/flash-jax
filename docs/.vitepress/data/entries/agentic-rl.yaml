# Agentic RL 条目（owner: agentic）。字段说明见 CONTRIBUTING.md §3。
# 组织顺序：范式源头 → 方法与框架 → 搜索与深度研究 → 工具集成推理 → 代码与 SWE → GUI → 工业级智能体模型。

# ───────────── 范式源头 ─────────────
- id: webgpt
  title: "WebGPT: Browser-assisted question-answering with human feedback"
  short: WebGPT
  kind: paper
  org: OpenAI
  authors: "Reiichiro Nakano et al."
  date: 2021-12
  arxiv: "2112.09332"
  areas: [agentic-rl]
  facets: [env, algorithm]
  tier: rec
  evidence: [ablation, community]
  evidence_note: "OpenAI 早期把语言模型放进文本浏览器环境的系统性工作，对行为克隆、奖励模型、拒绝采样与 RL 做了成体系的对照；论文高引用，是搜索智能体与“带引用回答”的共同源头。"
  summary: "把 GPT-3 放进文本浏览器（搜索、点击、滚动、摘录引用），先模仿人类演示，再用基于人类偏好的奖励模型做拒绝采样与 RL；要求回答附带引用，便于人工核验事实。"
  plain: "让模型像人一样上网查资料、边查边记出处，再请人打分教它哪种回答更好。它是搜索智能体的老祖宗。"
  takeaways:
    - "奖励模型不够准时，对奖励模型做 best-of-n 拒绝采样常常不输 RL 而且更稳，先把它当基线。"
    - "让智能体输出可核验的引用，人工评估与奖励建模都会容易得多。"
  tags: [浏览器环境, 奖励模型, 拒绝采样]

- id: react
  title: "ReAct: Synergizing Reasoning and Acting in Language Models"
  short: ReAct
  kind: paper
  org: "Princeton · Google Research"
  authors: "Shunyu Yao et al."
  date: 2022-10
  venue: ICLR 2023
  arxiv: "2210.03629"
  repo: ysymyth/ReAct
  areas: [agentic-rl]
  facets: [env]
  tier: must
  evidence: [adopted, open-source, community]
  evidence_note: "“思考—行动—观察”交替的轨迹格式已成为智能体训练与推理的事实标准：Tongyi DeepResearch 技术报告明确以原版 ReAct 作为 rollout 格式，WebDancer 等也基于 ReAct 构建；论文引用量极高。"
  summary: "让模型交替生成推理（Thought）与动作（Action），动作交给环境执行并返回观察（Observation），再继续推理；仅靠少样本提示就在 HotpotQA、FEVER、ALFWorld、WebShop 上优于纯推理或纯行动。"
  plain: "想一步、做一步、看结果，再想下一步。今天几乎所有智能体 RL 的轨迹都是这个格式。"
  takeaways:
    - "设计智能体 RL 的轨迹格式时，从 Thought / Action / Observation 三段式出发，最容易与现有框架和数据兼容。"
    - "Observation 由环境写入而非模型生成，训练时应从策略损失中屏蔽。"
  tags: [ReAct, 智能体循环, 工具调用]

- id: openai-deep-research
  title: "Introducing deep research"
  short: OpenAI Deep Research
  kind: blog
  org: OpenAI
  date: "2025-02-02"
  url: https://openai.com/index/introducing-deep-research/
  areas: [agentic-rl]
  facets: [env]
  tier: rec
  evidence: [industrial, community]
  evidence_note: "在 ChatGPT 中上线的生产级研究智能体；官方博客说明它由针对网页浏览与数据分析优化的 o3 版本驱动，并用端到端 RL 在困难浏览与推理任务上训练。Search-R1、WebSailor、Kimi-Researcher 等开源与工业工作都把它作为对标对象。"
  summary: "OpenAI 的深度研究智能体：由面向网页浏览与数据分析优化的 o3 版本驱动，官方称其通过端到端强化学习在困难浏览与推理任务上训练，学会规划多步检索、回溯并根据实时信息调整，最终生成带引用的报告。"
  plain: "它把“让模型自己上网研究几十分钟再交报告”做成了产品，也让“用端到端 RL 训练智能体”成了行业共识。"
  takeaways:
    - "深度研究能力的主流训练方式是“困难浏览任务 + 端到端 RL”，Kimi-Researcher、Tongyi DeepResearch 等后来者都走了这条路。"
  builds_on: [webgpt, openai-o1]
  tags: [深度研究, 工业产品]

# ───────────── 方法与框架 ─────────────
- id: archer
  title: "ArCHer: Training Language Model Agents via Hierarchical Multi-Turn RL"
  short: ArCHer
  kind: paper
  org: "UC Berkeley · Google DeepMind"
  authors: "Yifei Zhou et al."
  date: 2024-02
  arxiv: "2402.19446"
  repo: YifeiZhou02/ArCHer
  areas: [agentic-rl]
  facets: [algorithm]
  tier: rec
  evidence: [ablation, open-source, community]
  evidence_note: "Sergey Levine、Aviral Kumar 组把分层 RL 引入多轮 LLM 智能体的代表作，与单轮 RLHF 式方法做了对照；同组后续的 DigiRL、SWEET-RL 延续了“在回合粒度上学习价值”的思路。"
  summary: "把多轮交互建模为分层 RL：上层用离策略 TD 学习在“整轮发言”粒度上估计价值，下层用这个价值为轮内逐 token 的策略梯度提供优势，兼顾样本效率与 LLM 的 token 级生成。"
  plain: "上层老师只评价“这一整轮说得好不好”，下层学生据此调整每个词，比只看最终结果学得快。"
  takeaways:
    - "多轮任务奖励稀疏时，先学一个回合级价值函数，再把它当作轮内 token 策略的基线。"
  tags: [分层 RL, 价值函数, 多轮]

- id: ragen
  title: "RAGEN: Understanding Self-Evolution in LLM Agents via Multi-Turn Reinforcement Learning"
  short: RAGEN / StarPO
  kind: paper
  org: "Northwestern · Stanford · Microsoft · UW"
  authors: "Zihan Wang et al."
  date: 2025-04
  arxiv: "2504.20073"
  repo: mll-lab-nu/RAGEN
  areas: [agentic-rl]
  facets: [algorithm, env]
  tier: rec
  evidence: [open-source, ablation, community]
  evidence_note: "最早被广泛使用的开源多轮智能体 RL 框架之一，Search-R1 的实现即基于 veRL 与 RAGEN（见 Search-R1 仓库致谢）；论文在可控小环境里系统拆解了多轮 RL 的失稳模式。"
  summary: "提出轨迹级智能体 RL 框架 StarPO，并发现多轮 RL 的“回声陷阱”（Echo Trap）：奖励方差骤降、梯度尖峰、推理退化；StarPO-S 用轨迹过滤、引入 critic 与梯度稳定化缓解。"
  plain: "多轮 RL 训着训着会变成复读机：模型反复用同一套路，奖励不再有区分，训练就崩了。RAGEN 把这个现象讲清楚并给了几个补丁。"
  takeaways:
    - "监控组内奖励方差：方差塌到接近 0 往往是崩溃前兆，应过滤低方差轨迹组。"
    - "rollout 设计上，初始状态要多样、每轮动作数适中、采样更频繁（更 on-policy）。"
    - "缺少细粒度、感知推理的奖励时，多轮 RL 很难自发长出有效推理，可能只学到浅层套路。"
  tags: [StarPO, Echo Trap, 多轮 RL]

- id: gigpo
  title: "Group-in-Group Policy Optimization for LLM Agent Training"
  short: GiGPO
  kind: paper
  org: 南洋理工大学
  authors: "Lang Feng et al."
  date: 2025-05
  venue: NeurIPS 2025
  arxiv: "2505.10978"
  repo: langfengQ/verl-agent
  areas: [agentic-rl]
  facets: [algorithm]
  tier: rec
  evidence: [adopted, open-source, ablation, community]
  evidence_note: "阿里 ROLL 框架已原生支持 GiGPO，OpenManus-RL 采用了 verl-agent 式训练管线（见 verl-agent 仓库 News）；NeurIPS 2025 接收；verl-agent 提供 ALFWorld、WebShop、Search、Sokoban 等环境与完整训练日志。"
  summary: "在 GRPO 的轨迹级组内优势之外，按“锚状态”（不同轨迹中的相同环境观察）回溯构造步级小组，计算步级相对优势并加权相加；无需 critic、不增 rollout，ALFWorld、WebShop 上比 GRPO 高 12%、9% 以上。"
  plain: "同一道题跑多遍，总有几条轨迹走到同一个路口；比较它们在这个路口各自怎么选、后来得了多少分，就知道哪一步走得好。"
  takeaways:
    - "环境状态会重复出现（文本游戏、网页、表单）时，用锚状态分组给步级信用，几乎零额外成本。"
    - "观察很少完全相同（如搜索结果）时，改用相似度阈值分组，verl-agent 已给出实现。"
  builds_on: [grpo]
  tags: [信用分配, 步级优势, verl-agent]

- id: sweet-rl
  title: "SWEET-RL: Training Multi-Turn LLM Agents on Collaborative Reasoning Tasks"
  short: SWEET-RL
  kind: paper
  org: "Meta FAIR · UC Berkeley"
  authors: "Yifei Zhou et al."
  date: 2025-03
  arxiv: "2503.15478"
  repo: facebookresearch/sweet_rl
  areas: [agentic-rl]
  facets: [algorithm, env]
  tier: ref
  evidence: [ablation, open-source]
  evidence_note: "提出多轮人机协作基准 ColBench（后端编程与前端设计）并开源数据与代码，在同一基准上与多种多轮 RL 方法做了对照。"
  summary: "训练时让 critic 看到策略看不到的额外信息（如参考答案），为每一轮给出步级奖励，再用于优化策略；在 ColBench 上比其他多轮 RL 方法的成功率与胜率高约 6 个百分点，8B 模型可比肩 GPT-4o。"
  plain: "评委手里有标准答案、选手没有；评委据此逐轮点评，选手就知道哪一轮说错了。"
  takeaways:
    - "训练期才有的特权信息（参考解、隐藏测试、环境真值）可以只喂给 critic 或过程奖励模型，而不喂给策略，从而得到更细的步级信号。"
  builds_on: [archer]
  tags: [信用分配, 非对称 critic, 多轮协作]

- id: agentgym-rl
  title: "AgentGym-RL: Training LLM Agents for Long-Horizon Decision Making through Multi-Turn Reinforcement Learning"
  short: AgentGym-RL
  kind: paper
  org: "复旦大学 · 字节跳动 · 上海创智学院"
  authors: "Zhiheng Xi et al."
  date: 2025-09
  arxiv: "2509.08755"
  repo: WooooDyy/AgentGym-RL
  areas: [agentic-rl]
  facets: [env, algorithm]
  tier: rec
  evidence: [open-source, ablation]
  evidence_note: "环境、智能体、训练三模块解耦，环境以统一 HTTP 协议的服务端—客户端形式接入；在 27 个任务上系统评测并开源代码与数据。"
  summary: "模块化的多轮智能体 RL 框架，覆盖网页导航、深度搜索、文本游戏、具身与科学任务，支持 PPO、GRPO、REINFORCE++；提出 ScalingInter-RL：训练早期限制交互轮数先求稳，再逐步放宽以鼓励探索。"
  plain: "像教小孩下棋：先只让走几步把基本功练稳，再慢慢允许下完整盘，边练边加难度。"
  takeaways:
    - "交互轮数上限可以当作课程：先短后长，能缓解长程 RL 早期的不稳定与无效探索。"
  builds_on: [ragen]
  tags: [多环境, 交互课程]

- id: agent-lightning
  title: "Agent Lightning: Train ANY AI Agents with Reinforcement Learning"
  short: Agent Lightning
  kind: paper
  org: 微软研究院
  date: 2025-08
  arxiv: "2508.03680"
  repo: microsoft/agent-lightning
  areas: [agentic-rl]
  facets: [infra, algorithm]
  tier: rec
  evidence: [open-source, community]
  evidence_note: "微软开源、持续维护的智能体训练框架，文档完善；演示了 LangChain 文本转 SQL、OpenAI Agents SDK 的 RAG、AutoGen 的数学工具智能体三类接入。"
  summary: "把智能体执行与 RL 训练解耦：将任意框架（LangChain、AutoGen 等）写的智能体执行过程建模为 MDP，由分层算法 LightningRL 把轨迹拆成单步训练样本，几乎不改原有代码。"
  plain: "你已经用各种框架搭好了智能体？不用重写，接上它就能拿运行记录直接做 RL。"
  takeaways:
    - "已有生产智能体时，优先考虑“旁路采集轨迹 + 拆成单步样本”的训练方式，而不是把业务逻辑迁进 RL 框架。"
  builds_on: [verl]
  tags: [训练框架, 训推解耦]

# ───────────── 搜索与深度研究 ─────────────
- id: search-r1
  title: "Search-R1: Training LLMs to Reason and Leverage Search Engines with Reinforcement Learning"
  short: Search-R1
  kind: paper
  org: "UIUC · UMass Amherst · Google Cloud AI Research"
  authors: "Bowen Jin et al."
  date: 2025-03
  arxiv: "2503.09516"
  repo: PeterGriffinJin/Search-R1
  links:
    - { label: 实证研究续篇, url: "https://arxiv.org/abs/2505.15117" }
  areas: [agentic-rl]
  facets: [algorithm, env]
  tier: must
  evidence: [adopted, open-source, ablation, community]
  evidence_note: "搜索智能体 RL 的最小可复现范式：veRL 官方多轮工具示例、SkyRL 以及 Thinking Machines 的 Tinker cookbook 都收录了它的配方（见仓库 News）；ZeroSearch、DeepResearcher、ASearcher 等以它为基线。代码、数据、检索索引与 W&B 日志全部公开。"
  summary: "把 R1 式结果奖励 RL 扩展到“推理中穿插搜索”：模型用 search 标签发起检索、结果以 information 块写回上下文；关键是对检索回的 token 做损失屏蔽，仅用精确匹配（EM）奖励训练，PPO 与 GRPO 均可。"
  plain: "教模型“不懂就去搜”：自己决定何时搜、搜什么，答对才给分；搜回来的资料不是模型写的，所以不拿它算梯度。"
  takeaways:
    - "检索结果一定要从策略损失中屏蔽；作者在 v0.2 修复屏蔽 bug 后训练稳定性明显提升。"
    - "GRPO 收敛快，但在部分模型上会奖励崩塌；PPO 更稳。先用 PPO 跑通，再试 GRPO。"
    - "格式奖励有用、中间检索奖励作用有限；基座与指令模型最终奖励相近，指令模型起步更快。"
  builds_on: [deepseek-r1, ragen]
  tags: [搜索, 检索屏蔽, EM 奖励]

- id: r1-searcher
  title: "R1-Searcher: Incentivizing the Search Capability in LLMs via Reinforcement Learning"
  short: R1-Searcher
  kind: paper
  org: 中国人民大学
  authors: "Huatong Song et al."
  date: 2025-03
  arxiv: "2503.05592"
  repo: RUCAIBox/R1-Searcher
  areas: [agentic-rl]
  facets: [algorithm]
  tier: rec
  evidence: [open-source, ablation, community]
  evidence_note: "与 Search-R1 几乎同期的独立工作，代码与模型开源；团队随后发布 R1-Searcher++、SimpleDeepSearcher 等后续工作，在 HotpotQA、2Wiki、Bamboogle、Musique 等多跳 QA 上系统评测。"
  summary: "两阶段纯结果奖励 RL：第一阶段奖励正确的检索调用与格式，让模型学会“去搜”；第二阶段再奖励答案正确，让模型学会“用搜索答对”。不依赖过程奖励与蒸馏冷启动，在多跳 QA 上显著提升。"
  plain: "先教会模型“会用搜索”，再教它“用搜索答对题”，分两步走比一步到位更稳。"
  takeaways:
    - "冷启动阶段可以先只奖励正确的工具调用与格式，调用行为稳定后再切换到答案奖励。"
  builds_on: [deepseek-r1]
  tags: [搜索, 两阶段奖励]

- id: deepresearcher
  title: "DeepResearcher: Scaling Deep Research via Reinforcement Learning in Real-world Environments"
  short: DeepResearcher
  kind: paper
  org: 上海交通大学 GAIR
  authors: "Yuxiang Zheng et al."
  date: 2025-04
  arxiv: "2504.03160"
  repo: GAIR-NLP/DeepResearcher
  areas: [agentic-rl]
  facets: [env, infra]
  tier: rec
  evidence: [open-source, ablation, community]
  evidence_note: "首批在真实网页搜索环境里端到端做 RL 的开源工作，系统对比了提示工程方法与在本地 RAG 环境训练的 RL 智能体；代码与 7B 模型开源。"
  summary: "在真实搜索 API 与网页浏览环境中端到端训练深度研究智能体，并工程化处理限流、网页噪声与抓取失败；较提示工程基线最高提升 28.9 分、较 RAG 环境训练的 RL 智能体最高提升 7.2 分，并涌现规划、交叉验证与诚实拒答。"
  plain: "不在离线维基里练，直接上真网练；虽然更贵更乱，但学出来的本事更接近真实场景。"
  takeaways:
    - "在本地 RAG 环境训练的搜索智能体迁到开放网页会掉点；目标是开放网页任务，就尽量在真实或逼真的环境里训练。"
    - "真实环境必须配重试、缓存与并发控制，否则工具故障会污染奖励。"
  builds_on: [search-r1]
  tags: [深度研究, 真实环境]

- id: zerosearch
  title: "ZeroSearch: Incentivize the Search Capability of LLMs without Searching"
  short: ZeroSearch
  kind: paper
  org: 阿里巴巴通义实验室
  authors: "Hao Sun et al."
  date: 2025-05
  arxiv: "2505.04588"
  repo: Alibaba-NLP/ZeroSearch
  areas: [agentic-rl]
  facets: [env, data]
  tier: rec
  evidence: [open-source, ablation, community]
  evidence_note: "用 LLM 模拟搜索引擎替代真实 API，训练成本几乎只剩 GPU；Kimi K2 技术报告在介绍工具模拟器时将其列为“不依赖真实交互生成大规模数据”的代表工作。代码与模拟器权重开源。"
  summary: "先用轻量 SFT 把一个 LLM 训成“搜索引擎模拟器”，按提示生成相关或带噪文档；RL 时按课程逐步提高噪声文档比例，让策略在零 API 成本下学会检索与甄别，3B 模拟器即可有效。"
  plain: "不花钱调搜索 API，而是让另一个模型假扮搜索引擎，还故意掺点烂结果，逼策略学会分辨好坏资料。"
  takeaways:
    - "真实搜索 API 太贵或不稳定时，可以用微调过的模拟器训练，再在真实搜索上评测。"
    - "逐步提高噪声文档比例，是一种简单有效的环境课程。"
  builds_on: [search-r1]
  tags: [模拟环境, 课程学习, 搜索]

- id: webdancer
  title: "WebDancer: Towards Autonomous Information Seeking Agency"
  short: WebDancer
  kind: paper
  org: 阿里巴巴通义实验室
  date: 2025-05
  venue: NeurIPS 2025
  arxiv: "2505.22648"
  links:
