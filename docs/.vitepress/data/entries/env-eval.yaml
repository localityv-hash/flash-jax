  summary: "持续从三大竞赛平台收集新发布的题目并记录发布日期：评测时只用模型训练截止之后的题，从而检测并规避污染；除代码生成外还覆盖自我修复、代码执行与测试输出预测。"
  plain: "只用“模型训练完之后才出的新题”来考它，这样它不可能提前背过答案；对比同一模型在新旧题上的成绩差，还能反过来发现泄漏。"
  takeaways:
    - "报告 LiveCodeBench 时写明版本与题目时间窗，并确保窗口晚于被测模型的数据截止日期。"
