- id: lets-verify
  title: "Let's Verify Step by Step"
  short: Let's Verify / PRM800K
  kind: paper
  org: OpenAI
  authors: "Hunter Lightman et al."
  date: 2023-05
  venue: ICLR 2024
  arxiv: "2305.20050"
  repo: openai/prm800k
  areas: [rl-llm]
  facets: [data, algorithm]
  tier: rec
  evidence: [open-source, ablation, community]
  evidence_note: "OpenAI 团队在同一基座上大规模对照结果监督与过程监督；公开 80 万条步骤级标注 PRM800K，成为后续 PRM 研究最常用的对照数据；DeepSeek-R1 讨论 PRM 取舍时即以它为代表。"
  summary: "在 MATH 上系统比较结果监督（ORM）与过程监督（PRM）：逐步标注训练的 PRM 用于 best-of-N 重排显著优于 ORM，在代表性子集上解出 78% 的题；主动学习能进一步提升标注效率。"
  plain: "老师不只看最后答案，而是一步步批改；用这种“逐步批改员”从很多份答卷里挑最好的，比只看结果挑得准。"
  takeaways:
    - "PRM 的主战场是重排与搜索；把它直接当大规模在线 RL 的奖励，要先解决步骤切分、标注成本与被钻空子三件事（见 DeepSeek-R1 的失败尝试）。"
    - "做过程标注时优先标“看起来对、其实错”的高置信错误样本（主动学习），同样预算下信息量更大。"
  tags: [PRM, 过程监督, 数据集]

- id: prime
  title: "Process Reinforcement through Implicit Rewards"
  short: PRIME
  kind: paper
  org: 上海人工智能实验室 · 清华大学 · UIUC 等
  authors: "Ganqu Cui et al."
  date: 2025-01
  arxiv: "2502.01456"
  repo: PRIME-RL/PRIME
  areas: [rl-llm]
  facets: [algorithm]
  tier: rec
  evidence: [open-source, ablation, community]
  evidence_note: "2025-01 先发布博客、代码与模型，2 月上线论文；Eurus-2-7B-PRIME 权重与数据开源，算法已并入 verl 的 recipe；消融覆盖 PRM 初始化、在线更新与优势组合方式。"
  summary: "隐式 PRM 只用结果标签训练，却能给出逐 token 的过程奖励，并随策略在线更新以减轻分布漂移与奖励作弊；Eurus-2-7B-PRIME 在主要数学推理基准上比 SFT 模型平均提升 16.7%。"
  plain: "不用人一步步标注，只用“最后对没对”训练一个会给每一步打分的模型，并且边训练边更新，让策略不容易钻它的空子。"
  takeaways:
    - "想要稠密奖励又没有步骤标注时，可用 SFT 模型初始化隐式 PRM，再用结果验证器的标签在线更新。"
    - "过程奖励与结果奖励分别估计回报再相加（PRIME 对两者分别做 RLOO），比直接混成一个标量更稳。"
  builds_on: [lets-verify, rloo]
  tags: [隐式 PRM, 稠密奖励, 在线更新]

