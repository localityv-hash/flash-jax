  summary: "1T 总参、32B 激活的 MoE。后训练核心是大规模智能体数据合成（真实与合成工具、用户模拟、带状态的工具模拟器、rubric 评判过滤）与联合 RL；SWE 环境由 Kubernetes 支撑 1 万以上并发沙箱。"
