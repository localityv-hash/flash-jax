- id: kimi-k3
  title: "Kimi K3: Open Frontier Intelligence"
  short: Kimi K3
  kind: report
  org: Moonshot AI
  date: 2026-07
  arxiv: "2607.24653"
  repo: MoonshotAI/Kimi-K3
  areas: [rl-llm, agentic-rl]
  facets: [algorithm, env]
  tier: rec
  evidence: [industrial, open-source]
  evidence_note: "月之暗面开源 2.8T 参数模型权重与完整报告；RL 算法沿用 Kimi K2.5（token 级 log-ratio 掩码加平方正则），RLHF Book 的课程材料把它列为 2026 年“领域专家 RL + 多教师在线蒸馏”配方的代表。"
  summary: "后训练三步：SFT 冷启动；三个领域 × 三档推理强度各训一个 RL 专家（共九个）；再用多教师在线策略蒸馏合并。RL 用 partial rollout 砍掉长尾等待，靠逐 token 正则容忍由此带来的陈旧数据，并按题预算控制推理长度。"
  plain: "先分科、分档培养九位“专科尖子”，再让一个学生跟着他们边做边学；训练时超出字数预算的答案直接判负，防止无休止地想。"
  takeaways:
    - '推理长度可以当作训练目标来调：用冷启动模型按题估计初始 token 预算 $b_0(x)$，超过 $\tau\cdot b_0(x)$ 即把奖励改为 −1；先用大 $\tau$ 训出最高档，再逐步收紧 $\tau$ 得到低档。'
    - "智能体环境要把被评者与验证器隔离：公开验证器给诊断反馈、隐藏验证器评估留出场景，并限制提交次数。"
    - "生成式 RM 容易偏爱冗长输出：K3 规定超出长度阈值的候选在两两比较中直接判负。"
  builds_on: [kimi-k1-5, kimi-k2-5]
  tags: [领域专家, 多教师 OPD, 推理强度, 防奖励作弊]

