# 环境与评测（/topics/multi-env、/lenses/eval）的条目。
# 环境侧：观点与趋势、环境接口与 Hub、程序化/SWE/工具环境的规模化合成；
# 评测侧：基准（按任务类型）、指标与统计方法、动态基准与智能体评测方法论。

# ───────────────────────── 观点与环境接口 ─────────────────────────

- id: the-second-half
  title: "The Second Half"
  short: The Second Half
  kind: blog
  org: Shunyu Yao 个人博客（时任 OpenAI）
  authors: "Shunyu Yao"
  date: "2025-04-10"
  url: https://ysymyth.github.io/The-Second-Half/
  areas: [agentic-rl, rl-llm]
  facets: [env, eval, theory]
  tier: ref
  evidence: [community]
  evidence_note: "ReAct、τ-bench 作者的长文，基于其在斯坦福 CS224N 与哥伦比亚大学的演讲整理，发布后在中英文社区被大量转载讨论，“评测比训练更重要”成为 2025 年讨论环境与评测时最常被引用的说法之一。它是观点文章而非实验论文：论据来自作者对 o 系列、Deep Research 等进展的一线观察，没有对照实验，按证据标准只能列为参考，但读环境与评测两页前值得先读。"
  summary: "认为 RL 的三要素中，语言预训练提供的先验和“把推理当作动作”的环境设计已经让通用配方跑通，算法反而最不关键；AI 的下半场应从“解题”转向“定义问题”，重新设计贴近真实效用的评测设定。"
  plain: "上半场比谁的方法能把考试分数刷高；现在一套通用配方几乎什么考试都能刷高，于是真正稀缺的变成了“出好题”：设计出和真实世界更像的考法和练习场。"
  takeaways:
    - "立项前先问“评测设定是否贴近真实使用”：自动化、i.i.d. 的评测默认值（无人参与、任务互相独立）本身就可能是需要打破的假设。"
    - "把新环境或新评测当作一等研究产出，而不是训练方法论文的附属品。"
  tags: [观点, 环境, 评测设定, 效用问题]

